<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — VERIDIAN AI</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1C2B3A;
    color: #FFFDF9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; opacity: 0.7; margin: 0 0 20px; line-height: 1.5; }
  button {
    background: #F5820A;
    color: #FFFDF9;
    border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>VERIDIAN AI needs a network connection. Reconnect and try again — your work will be right where you left it.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
