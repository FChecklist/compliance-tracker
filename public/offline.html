<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline -- VERIDIAN AI</title>
<!--
  Static fallback for a navigation that fails while offline and has no
  already-loaded client-side app in the tab -- see public/sw.js's header
  comment for why this is never populated with real cached page data
  (personalized SSR + Set-Cookie risk). Deliberately zero JS/CSS
  dependencies (inline styles only) so it renders even when every other
  asset request also fails. Pre-cached on service-worker `install` (see
  sw.js) so this is available even on a tab's very first load.
-->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #FFFDF9; color: #1C2B3A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 420px; }
  h1 { font-size: 1.375rem; margin: 0 0 8px; }
  p { color: #55606b; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #F5820A; color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 0.9375rem; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page hasn't been loaded yet, so there's no saved data to show. Pages you've already visited while online -- including FM register digitization and site diary data -- stay available offline. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
