      at all before this fix). Confirms and completes the 2026-09-20
      investigation below (line ~4555) that correctly identified "getProjectExceptions()'s
      24 sequential detectors" as the real bottleneck but had not yet
      isolated which detectors or implemented a fix -- 4 timeout bumps
      (8s->20s->35s->60s) on that investigation's own admission never fixed
      it because the problem was never the timeout budget.

      Fix: batched each flagged detector to O(1)-O(3) queries total
      regardless of row count (fetch the full ID set once, do an IN-clause
      lookup for the dependent table once, cross-reference in memory) --
      same sequential-detector-call structure and single-transaction
      withTenantContext model preserved (NOT switched to Promise.all --
      that would reopen the exact pool-contention/nested-transaction risk
      class this file's own header comment and CLAUDE.md's R74/R75 sections
      already warn against; a batched query count that no longer scales
      with N needed no concurrency change at all).
      findMismatchedSubcontractorInvoices also now starts from the
      project's own BOQs instead of scanning erp_purchase_invoice_items
      with no org/project filter at all, which was both slower and an
      unnecessary widening of what it read.

      Added a query-count regression-guard test per fixed detector
      (construction-exceptions-service.test.ts) asserting a bounded,
      N-independent number of query calls at N=25 rows -- these fail
      immediately if a future edit reintroduces a per-row query, the same
