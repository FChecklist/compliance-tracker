- id: auto_conversation_log
  type: hook_pipeline
  scope: 'Root-cause fix for "you not logging every discussion" (Owner, 2026-07-20). Confirmed the gap
    first, not assumed: a direct query before this fix found 13 instructions / 60 work_items / only 3
    actions logged for the entire day against 150+ real tool calls -- manual, milestone-granularity logging
    was the actual cause. Replaced with Claude Code''s own hook system, which fires unconditionally on
    every prompt and every tool call regardless of whether an AI agent remembers to log it.'
  components:
    local_hooks:
      path: C:\Users\Dell\Downloads\Claude Code\.claude\hooks\log-prompt.ps1, log-tool-use.ps1, log-turn-end.ps1,
        sync-queue-to-server.ps1
      registered_in: C:\Users\Dell\Downloads\Claude Code\.claude\settings.local.json (hooks.UserPromptSubmit,
        hooks.PostToolUse[Bash], hooks.Stop)
      design: Hooks write instantly to a local NDJSON queue (.claude/hooks-queue/conversation-log.ndjson)
        -- zero network I/O in the interactive path, since this session's own SSH connection showed real,
        repeated transient timeouts all evening and a live SSH call inside every hook would have made
        every single prompt/tool-call fragile and slow. The Stop hook starts a DETACHED background sync
        process (Start-Process -WindowStyle Hidden) that drains the queue asynchronously -- the interactive
        turn never waits on it. Every hook script is wrapped in try/catch that swallows all errors and
        always exits 0 with no blocking "decision" field -- confirmed via Claude Code's hook exit-code
        semantics that this can never block or fail the actual interaction.
    sync_script:
      path: C:\Users\Dell\Downloads\Claude Code\.claude\hooks\sync-queue-to-server.ps1
      design: Renames the live queue to a timestamped pending-*.ndjson file (atomic, avoids a race with
        hooks still appending), uploads it in ONE scp, runs ONE remote batch-import invocation, deletes
        the pending file only on confirmed success. On any failure (confirmed live during testing -- a
        real SSH connection timeout hit on the very first sync attempt), the pending file is preserved
        and retried on the next Stop event -- no queued event is ever silently lost, errors land in hooks-queue/sync-errors.log.
    batch_importer:
      path: /opt/veridian/scripts/batch-import-conversation-log.py
      mirror: /opt/veridian/repos/compliance-tracker/ai-os/scripts/batch-import-conversation-log.py
      design: 'Bulk-inserts a whole NDJSON batch into instructions/actions directly via sqlite3, reusing
        superboss-register.py''s own schema/ID conventions exactly (not a parallel logging path). Real
        bug found and fixed before this was trusted: the first real batch run (395 rows) hit a genuine
        UNIQUE constraint collision on action_id -- the CLI''s original _new_id() (timestamp + 4-hex-random)
        is safe for one-ID-per-process- invocation use but not for a tight loop minting hundreds of IDs
        within the same wall-clock second (a real birthday-paradox collision, not a freak accident). Fixed
        with a monotonic per-process counter appended to every ID.'
    end_to_end_test: 'Full pipeline verified with real data before being trusted: (1) manual synthetic
      payloads through all 3 hook scripts, confirmed correct queue writes and exit 0; (2) live background
      sync, which hit and correctly recovered from a real transient SSH timeout without losing the pending
      file; (3) verified the synced rows are real and FTS-searchable in the register; (4) all manual-test
      rows cleaned up afterward so they don''t pollute the real record.'
