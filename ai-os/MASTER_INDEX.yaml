schema_version: 1
audience: ai_and_software_only
protocol: READ_THIS_FILE_FIRST. Before any grep/find/read across this server or the compliance-tracker/projexa/veda-advisors/claude-control
  repos, before writing any new script/table/register, query this file for an existing match. If a match
  exists, use it or extend it -- do not create a parallel mechanism. If check-duplicate (system_index)
  and this file both show no match, proceed, then register the new thing in system_index (index-add) AND
  in this file's relevant list.
built_ts: '2026-07-30T04:09:37.539919+00:00'
built_by: superboss_interactive_session
audit_passes_complete: 3
audit_passes_required: 3
canonical_path_live: /opt/veridian/ai-os/MASTER_INDEX.yaml
canonical_path_repo: /opt/veridian/repos/compliance-tracker/ai-os/MASTER_INDEX.yaml
sync_mechanism:
  script: /opt/veridian/scripts/system-sync.py
  run_on_demand: python3 /opt/veridian/scripts/system-sync.py [--dry-run] [--check mirror|constitution|unindexed|resume-balance|all].
    Run this whenever you suspect the live server, this file, CONSTITUTION.yaml, or the git-tracked script
    mirrors have drifted apart -- it is the single entrypoint for "sync the whole system," built 2026-07-20
    per Owner directive ("one server, one system," see registries.system_sync_mechanism for full detail).
  run_on_schedule: Wired into crontab via run-logged.sh (registries.auto_execution_wrapper), see registries.system_sync_mechanism.cron_schedule.
  do_not_build_a_new_sync_script: If a future session finds drift/staleness this script's 3 checks don't
    cover, EXTEND this script with a 4th check function -- do not write a parallel sync mechanism. This
    file's own protocol field exists precisely to prevent that failure mode.
root_cause_confirmed:
  finding: Unscoped filesystem search (find/grep without prune) traverses node_modules trees (per-repo,
    multiple GB) and per-task git-worktree copies of the entire repo under ai-os/tasks/*/workspace/ --
    both contain files with basenames identical to canonical files (CONSTITUTION.yaml, CONTROLLER.yaml
    appear 100+ times each across worktree copies alone).
  incident_evidence: Unscoped `find /opt/veridian -iname CONSTITUTION.yaml` returned 200+ hits, ~198 of
    them ai-os/tasks/*/workspace/ worktree copies, 0 informative. Same command with -prune on the excluded
    paths returned in under 2 seconds with the 1 canonical hit.
  fix: Apply exclusion_rules below on every search. Single highest-leverage fix for search speed and wrong-file
    selection.
exclusion_rules:
  must_prune_not_just_exclude: true
  reason: find -not -path still descends into and stats every excluded directory; only -prune skips the
    subtree, which is the actual speed fix.
  prune_paths:
  - '*/node_modules/*'
  - '*/.git/*'
  - /opt/veridian/ai-os/tasks/*/workspace/*
  - /opt/veridian/workspace/claude-cli-work/*
  - /opt/veridian/workspace/main-e2e-check/*
  correct_find_pattern: find <roots> \( -path '*/node_modules' -o -path '*/.git' -o -path '*/ai-os/tasks'
    -o -path '*/workspace/claude-cli-work' \) -prune -o -type f -iname '<pattern>' -print
search_layers_relationship:
  purpose: 'Added 2026-07-30 (master-index-central-entrypoint-confirmation-phase6) directly answering
    the Owner''s question ''is MASTER_INDEX.yaml THE central place to read all documentation.'' Short
    answer: yes for browsable human-readable narrative/scope, but it is one of 4 complementary layers
    of ONE system (this file, knowledge_engine, wiring_registry, system_index), not the only mechanism.'
  master_index_yaml: 'THIS file. The BROWSABLE index -- read it first (see protocol field above) for narrative
    scope/status per registry/system. Hand-maintained: registries[] entries are appended per-task, not
    auto-generated from source; only the initiative-status field and the unregistered_mentions_backlog
    get script-corrected on each regenerate_master_index.py run.'
  knowledge_engine: 'ai-os/memory/superboss-register.sqlite''s knowledge_engine table -- the SEARCHABLE,
    machine-authoritative layer for drift-detection. Query: `superboss-register.py query-knowledge <term>`.
    Complementary, not competing, with this file: this file stays authoritative for human citation/scope
    narrative; knowledge_engine stays authoritative for machine drift-detection -- see registries.metadata_engine_reconciliation
    for the full sync-direction contract.'
  wiring_registry: ai-os/memory/superboss-register.sqlite's wiring_registry table -- the CODE-LEVEL ENTITY-RELATIONSHIP
    GRAPH (engine/gateway/table/function/route/file/script/cron_job/ai_role), mechanically generated from
    8 live sources (never hand-authored). Answers 'what calls / is-called-by what,' a question neither
    this file nor knowledge_engine's own rows answer.
  system_index: ai-os/memory/superboss-register.sqlite's system_index table -- the fast EXISTENCE-CHECK
    layer ('does X already exist before I build it'), queried via `superboss-register.py check-duplicate`/`search`.
    This is the check-before-build gate this file's own top-level protocol field instructs every reader
    to use before writing any new script/table/register.
  protocol_owner_ai_yaml: 'ai-os/OWNER_DIRECTIVES/PROTOCOL_OWNER_AI.yaml -- a different axis entirely:
    it governs HOW work gets done (execution location, communication cadence, quality bars, self-correction
    rules), not WHERE documentation about a given system lives. Complementary, not competing.'
  agents_md_note: Per-repo AGENTS.md files (compliance-tracker/projexa/veda-advisors) are AI-agent AUTHORIZATION
    rosters (who may act on that specific repo, with what authority) -- confirmed by direct read 2026-07-30,
    NOT a documentation index of any kind. Different purpose, not competing.
  readme_server_md_note: /opt/veridian/README-SERVER.md is a real, complementary infrastructure-ops reference
    (access, specs, security config, recovery runbook) for operating the physical/virtual machine itself
    -- not a 'where do I find docs about system/feature X' index. Different scope, not competing.
  read_order_for_a_new_reader: (1) this file's own protocol field for narrative 'where is X', (2) system_index
    check-duplicate before building anything new, (3) knowledge_engine query-knowledge for machine-verified
    freshness of a specific artifact, (4) wiring_registry for a specific call-graph question. 4 complementary
    layers of ONE system -- not 4 competing places to look.
  known_open_gap_this_note_does_not_fix: 'This live server file (canonical_path_live) and this git-tracked
    repo copy (canonical_path_repo) have real, substantial, pre-existing content drift -- confirmed 2026-07-30:
    the live copy has 97 registries[] entries pre-dating this pass, the repo copy (origin/main) has only
    50, and neither is a strict subset of the other (each has real entries the other lacks, e.g. repo-only:
    snip_token_reduction_hook, prompt_registry_version_lifecycle_extension; each also lacks some of the
    other''s structural fields, e.g. this repo copy has no unverified_findings_open_2026_07_22 key at
    all). This was already flagged, not caused, by this pass (see the terminology_standardization entry''s
    own note_on_repo_vs_live_drift) -- full reconciliation is explicitly out of this pass''s scope, same
    judgment call already made for registries.metadata_engine_reconciliation (''full merge too disruptive'').'
system_boundary:
  name: VERIDIAN AI OS
  subsystems:
    subsystem_1_software_dev_and_ai:
      description: Software Development & AI System -- this ops server (VERIDIAN-DEV, Hetzner 167.233.220.35),
        the autonomous worker fleet, its own SQLite register, and every mechanism this file itself indexes.
        See registries.system_diagram for the full component diagram.
    subsystem_2_software_and_end_user_management:
      description: Actual Software & End-User Management -- the deployed product (compliance-tracker +
        PROJEXA, treated as one integrated software per earlier Owner directive), running on Vercel with
        a Supabase Postgres backend.
    integration_note: Both subsystems act as ONE integrated system, not two separate ones -- see registries.ops_task_sync_bridge
      (subsystem 1 writes task state into subsystem 2's own database) and registries.app_layer_failure_visibility
      (subsystem 1 reads subsystem 2's failure state directly) for the concrete bridges that make this
      true in code, not just in this document.
  repos:
    core_veridian_and_customer_products:
      note: For running VERIDIAN AI OS and developing customer products/projects.
      members:
      - repo: FChecklist/compliance-tracker
        local_path: /opt/veridian/repos/compliance-tracker
        role: Brain repo -- holds every module and function (per its own CONSTITUTION.yaml control_model.rule).
          The app half of subsystem 2.
      - repo: FChecklist/projexa
        local_path: /opt/veridian/repos/projexa
        role: Construction-industry product branch, governed through compliance-tracker's modules (verified
          via veridian-client.ts + /api/v1/projexa/* calls, see CONSTITUTION.yaml control_model).
      - repo: FChecklist/veridian-ui-kit
        local_path: /opt/veridian/repos/veridian-ui-kit
        role: Shared UI component package (@fchecklist/veridian-ui-kit), 0 runtime deps, consumed by the
          product repos.
      - repo: FChecklist/claude-control
        local_path: /opt/veridian/repos/claude-control
        role: Outermost cross-project requirements/decision catalog (registries.cross_project_controller)
          -- config/YAML only, no application code.
    reverse_engineering:
      note: 'For reverse-engineering features -- these hold scraped documentation of THIRD-PARTY systems
        (Infisuite, Odoo, Zoho), not VERIDIAN''s own application code. Verified 2026-07-20: all 3 repos
        contain only docs/ and screenshots/ directories, no source code -- correctly excluded from the
        code catalogs (registries.database_catalog / registries.function_catalog only cover real app codebases).'
      members:
      - repo: FChecklist/odoo-reverse-engineering
        local_path: /opt/veridian/repos/odoo-reverse-engineering
      - repo: FChecklist/infisuite-reverse-engineering
        local_path: /opt/veridian/repos/infisuite-reverse-engineering
        role: 'Reverse-engineered across bharatnet/indyanet/cityline Infisuite tenants (CRM, Billstack,
          Contracts, Ticketing modules). Updated 2026-07-20: merged 2 fully-documented cityline worker
          branches (CRM+Billstack, Contracts -- both had succeeded earlier the same day but were left
          unmerged on origin/worker/* branches) into main, then closed the 3rd (Ticketing), whose 6 role-account
          logins had all genuinely failed automated auth, by riding the Owner''s already-authenticated
          real Chrome session (Claude in Chrome) to reach it directly -- same real-session-reuse pattern
          that separately unblocked Odoo''s Cloudflare Turnstile gate (see odoo-reverse-engineering/PROGRESS.md).
          Notable finding preserved in docs/cityline-contracts/contracts.md: a reproducible crash bug
          makes the Contract entity''s own list/create/view UI unreachable in that tenant.'
      - repo: FChecklist/zoho-reverse-engineering
        local_path: /opt/veridian/repos/zoho-reverse-engineering
        role: Zoho CRM + Zoho Projects field/screen documentation, built 2026-07-20 by navigating a live
