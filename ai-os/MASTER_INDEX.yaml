- id: worker_fleet_rca_fix_2026_07_20
  type: rca_and_permanent_fix
  scope: Root-causes and permanently fixes the 47-failed-unit/71.9%-task- failure-rate incident surfaced
    by registries.auto_execution_wrapper's first real health-check-15min.py run. Not the same incident
    as RCA_OVERNIGHT_DISPATCH_FAILURE_2026-07-20.md (that RCA is about the dispatch LOOP not firing overnight
    due to a laptop-bound Claude Desktop scheduled task; this RCA is about dispatched tasks failing downstream
    once running). Both concern the same overnight window, different mechanisms, cross-referenced here
    to prevent conflation.
  root_cause_1: OpenRouter account genuinely exhausted (total_credits=$40, total_usage=$40.07+, confirmed
    via OpenRouter's own /api/v1/credits endpoint -- ground truth, not this proxy's internal tracker).
    preflight-guard.py's existing check_proxy_health() only tracked the LOCAL proxy's own cumulative spend
    counter, which had drifted out of sync with the real account. Every worker's cheap 5-token canary
    call kept passing preflight (cheap enough to still succeed near-zero balance); the real task prompt
    (up to 64000 max_tokens) then hit a live OpenRouter 402, which systemd retried 3x per unit into a
    permanent failed state -- across at least 47 units.
  root_cause_1_deeper_bug: '`claude -p --output-format json` returns process exit code 0 even when the
    underlying API call failed (error captured only inside the JSON payload as is_error:true / api_error_status:402).
    This silently bypassed worker-entrypoint.sh''s entire `if [ "$EXIT_CODE" -ne 0 ]` failure path --
    no failure signature was ever recorded, so preflight-guard.py''s own circuit breaker (2 identical
    signatures trips it) had zero data to trip on despite 3 real, identical failures per unit. Confirmed
    directly: .failure_signatures.json did not exist for a sample failed task.'
  root_cause_2: 'A genuinely SEPARATE, second root cause found for 2 of the 47 units (deliberately not
    assumed to share root_cause_1 -- verified via recover-failed-workers.py reading each unit''s real
    result.json before touching it): these 2 legitimately hit the Claude CLI''s own --max-budget-usd $10
    per-task cap (terminal_reason:budget_exhausted, real ~$10.05-10.32 costs, 42-55 real turns) -- a guardrail
    working as designed, but worker-entrypoint.sh fell through to the same generic retry-storm path as
    any other failure instead of a clean hard-stop.'
  fix_1: 'preflight-guard.py: new check_openrouter_balance() function queries https://openrouter.ai/api/v1/credits
    directly (ground truth, cannot drift). Fails OPEN on any network/parse error on the check itself (never
    blocks real work over a check hiccup); fails CLOSED (hard stop, no API call made) if real remaining
    balance < $0.10. Ops-layer twin of the app-layer checkOpenRouterBalance() in cost-policy.ts. Wired
    into main() between check_proxy_health() and canary_call().'
  fix_2: 'worker-entrypoint.sh: (a) added "openrouter_balance_exhausted" to the hard-stop (non-retryable)
    reason list; (b) added an API_IS_ERROR detection block right after the main claude -p invocation that
    reads $MAIN_OUT''s own is_error field and forces EXIT_CODE=1 when true despite the process''s own
    exit 0, closing the deeper bug above; (c) enhanced record_failure_signature() to also hash result.json''s
    real API error text, not just worker.log (which is empty for this failure class); (d) added a second,
    distinct hard-stop block detecting subtype==error_max_budget_usd / terminal_reason==budget_exhausted
    in $MAIN_OUT, routing to checkpoint(status=blocked) + best-effort git commit/push of whatever progress
    existed + systemctl --user disable + explicit kill/wait of the background checkpoint loop + exit 0
