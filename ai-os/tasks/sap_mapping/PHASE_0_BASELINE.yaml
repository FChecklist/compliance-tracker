    result: 0
    explanation: 'This is a REAL finding, not a broken check: this codebase''s real Drizzle table-declaration
      pattern is `complianceSchemaDB.table(...)` / `platformSchemaDB.table(...)` (both schemas built off
      `pgSchema(''compliance''|''platform'')` then `.table(...)`), never the bare `pgTable(` call the
      spec''s own suggested command was written against. Confirmed by reading schema.ts''s own imports
