projexa_module_exposure:
  summary: PROJEXA's own REST API surface (src/app/api/v1/projexa/*, 171 route.ts files, verified via
    direct find) plus a separate, much narrower AI-chat 'module chain' surface, which changed materially
    TODAY (2026-07-28) via two coordinated, cross-repo, already-MERGED PRs.
  rest_api_surface:
    path: src/app/api/v1/projexa/*
    count: 171
    detail: Real per-feature REST endpoints PROJEXA's own UI pages call directly (not via AI chat). Heaviest
      exposure is PROJEXA's home turf -- construction/PM (schedule 10, procurement 11, payroll 12, floor-plans
      7, recruitment 8, quotations 5) -- but real coverage now spans Sales, Purchase, Accounting/GST-adjacent
      financial reporting (balance-sheet, profit-and-loss, trial-balance, ar-aging), and HR. See api_routes_by_domain
      above for the v1/projexa/* rows inside each domain's directories list -- this section only adds
      the cross-domain summary + what's conspicuously ABSENT below.
  conspicuously_absent_from_v1_projexa: 'Directly grepped src/app/api/v1/projexa/* subdirectory names
    against the full domain route inventory above; the following domain surfaces genuinely have NO v1/projexa/*
    proxy at all (zero matches, not a naming difference): (1) Helpdesk/ticketing -- zero tickets/ticket-teams/sla-policies/escalation-rules
    presence under v1/projexa, despite the full Helpdesk REST surface existing at src/app/api/tickets/*
    etc.; (2) GST-specific compliance (gst-reconciliation, tds-returns, e-invoice-logs, challans, HSN/GSTIN
    master data) -- v1/projexa has general ledger/reporting endpoints but none of the GST-specific ones;
    (3) Training/L&D (22 routes exist at src/app/api/training/*, none under v1/projexa); (4) Performance
    reviews (11 routes exist at src/app/api/performance-reviews/*, none under v1/projexa, despite payroll/attendance/leave/recruitment
    all being present).'
  ai_chat_module_chain_surface:
    route: GET /api/v1/projexa/module-chain
    backing_function: buildCapabilityTree() in src/lib/services/capability-tree-service.ts
    status_as_of_2026-07-28: MERGED TODAY, not yet-in-progress -- verified via `gh pr view` on both PRs'
      real state field (not just body text, which said 'Not merging, needs supervisor audit' -- a supervisor
      evidently audited and merged both after that text was written).
    compliance_tracker_pr:
      number: 609
      title: Expose full VERIDIAN module chain to PROJEXA via /api/v1/projexa/module-chain
      merged_at: '2026-07-28T04:11:24Z'
    projexa_pr:
      number: 59
      title: Wire full VERIDIAN module chain into PROJEXA's chat composer
      merged_at: '2026-07-28T03:19:17Z'
    before_this_pr_pair: 'PROJEXA''s chat composer only offered its own narrow Construction Intelligence
      chain (buildConstructionNodes(), a project-scoped subtree: dashboard/budget-status/KPI-status/AI-progress-summary/AI-risk
      per project, plus 2 org-wide leaves -- delayed activities, over-budget projects).'
    after_this_pr_pair: 'PROJEXA''s chat composer now also offers the SAME full module chain a compliance-tracker
      org''s own /chat page sees via buildCapabilityTree(): DB-driven ERP Product/Customer/Vendor branch
      nodes (branchNodes), product/entity nodes, compliance-item nodes, calculator nodes, GST-reconciliation
      nodes, Reports & Analysis (both the saved-report deep-link set and the unified Reports & Analysis
      catalog), Dynamic-Chain/''learned capabilities'' nodes, and CRM quick-create nodes -- with the construction_intelligence
      branch explicitly filtered out of this new response (PROJEXA already gets that branch from its own
      pre-existing /api/v1/projexa/capability-tree, so returning it twice would create a second source
      of truth).'
    important_distinction: This module-chain wiring is an AI-CHAT capability surface (what the chat composer's
      chain selector can dispatch to), not the same thing as the 171-route REST API surface above (what
      PROJEXA's own UI pages call directly for CRUD). A domain being newly chat-visible via module-chain
      does NOT mean PROJEXA's own UI has a page for it yet -- e.g. GST reconciliation is now chat-reachable
      via module-chain but still has no v1/projexa/* REST route and (per this task's own out-of-scope-for-PROJEXA-UI-audit
      note) no known dedicated PROJEXA UI page as of this inventory.
