meta:
  task: task-20260728-050704-sap-informed-veridian-phase-0--baseline
  purpose: 'Phase 0 of a larger Owner directive (SAP architecture understanding + VERIDIAN completion).
    Inventory-only: real, evidence-based baseline of what business-domain modules/tables/API-routes VERIDIAN
    (compliance-tracker + PROJEXA) currently has. No schema design, no SAP research, no code changes in
    this phase.'
  generated_date: '2026-07-28'
  primary_sources:
  - source: ai-os/DATABASE_CATALOG.json
    detail: 'Machine-generated (extract-db-schema-catalog.mjs, real drizzle-orm getTableConfig introspection,
      not AI-written). 449 tables. NOTE: its own source_file field shows it was generated from a task-20260726-102520
      workspace snapshot of schema.ts, i.e. it is already ~2 days stale relative to current main -- see
      discrepancy note below.'
  - source: claude-control repo's ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json
    detail: 'Lives in the separate claude-control repo (/opt/veridian/repos/claude-control/ai-os/), NOT
      in compliance-tracker -- the spec''s path (ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json, relative
      to compliance-tracker) does not exist in this repo; confirmed via git log --all and find, zero hits.
      7711 entities: 5019 function, 1940 file, 444 supabase_table, 195 ai_role, 40 script, 20 engine,
      14 cron_job, 10 gateway, 9 governance_doc, 7 github_repo, 6 route, 4 browser_component, 3 vercel_project.
      The 6 ''route'' entities are intent-to-engine chat-dispatch traces (e.g. ChainSelector.tsx -> payroll-engine.ts),
      not REST API routes -- not usable for a per-endpoint domain inventory. Its 1371 ''function'' entities
      whose path contains src/app/api/ (one per exported HTTP method per route.ts) were used as a real
      cross-check that direct grep of src/app/api found genuine route files, not as the primary route
      list itself (direct `find src/app/api -name route.ts` is the primary source for the routes section
      below).'
  - source: src/lib/db/schema.ts (direct grep, current main HEAD)
    detail: '11305 lines. Real pattern used in this codebase is `export const X = complianceSchemaDB.table(''x'',
      {...})` / `platformSchemaDB.table(...)` -- NOT the literal `pgTable(` call the spec''s own suggested
      sanity-check command greps for (see sanity_checks below: that command legitimately returns 0, which
      is itself a real finding, not a broken check). Used to (a) get the real current total table count
      (464, vs DATABASE_CATALOG.json''s stale 449) and (b) pull real file:line + real columns for the
      15 tables added to schema.ts since the DATABASE_CATALOG.json snapshot.'
  - source: src/app/api/ (direct find, current main HEAD)
    detail: '959 real route.ts files (`find $(pwd)/src/app/api -name route.ts`). NOTE: the same `find`
      command run with a relative path in this sandboxed shell silently truncated to 51 results with no
      error -- confirmed the truncation happens inside the shell''s own output-capture layer (it affected
      a file written via `>` redirection too, not just terminal display), not a real difference in the
      filesystem. Always used the absolute-path form after discovering this. Flagging this as an environment
      quirk worth knowing for any future session doing large-output grep/find in this sandbox.'
  schema_drift_since_database_catalog_snapshot:
    note: 'DATABASE_CATALOG.json (449 tables) is stale relative to current main (464 tables, verified
      via direct grep). Diffed export names: 15 new tables added, 0 removed. All 15 new tables were read
      directly from current schema.ts and are included in the domain inventory below, each flagged with
      a `note` field.'
    new_tables_since_snapshot:
    - businessHoursSchedules
    - constructionInterimBillLineItems
    - constructionInterimBills
    - escalationRules
    - hrEmployeeLoans
    - hrExpenseClaims
    - hrLoanInstallments
    - hrShiftRosterAssignments
    - hrShiftTypes
    - performanceReviewGoals
    - performanceReviewRaters
    - publicTicketSubmissionAttempts
    - slaPolicies
    - ticketEscalationEvents
    - ticketTeams
  out_of_scope_per_owner_directive: 'Manufacturing / Production-Planning / Plant-Maintenance: explicitly
    excluded per the Owner''s own directive. Verified via grep (manufactur|production_plan|bom|bill_of_material|work_order|routing|plant_maint)
    across table names and route paths: zero real hits (the only substring matches were aiRoutingPolicies/aiRoutingAuditLog
    -- AI model routing, unrelated). This domain genuinely does not exist yet in this codebase, so ''excluded''
    and ''absent'' happen to coincide here -- noted for honesty, not assumed.'
  adjacent_domains_found_but_not_requested: 'Not inventoried in detail (out of this task''s 8-domain scope)
    but flagged for awareness: fm* (13 tables, e.g. fmAmcContracts/fmAssets/fmPpmSchedules/fmVisitors
    -- Facility Management, closely adjacent to SAP Plant Maintenance conceptually though not literally
    excluded by name); legal* / litigationMatters (Legal Matter Management); firm* (CA/professional-services-firm
    practice management -- engagements, timesheets, invoices); interior* (Interior Design FF&E/floor-plans/mood-boards);
    posh* (POSH Act compliance); veriReward*; plus ~230 AI-OS/platform/governance tables (abac_*, approval_*,
    audit_*, ai_*, orchestra_*, loop_*, prompt_*, worker_agent_*, task_*, etc.) that are VERIDIAN AI OS
    infrastructure, not ERP/business-domain data.'
