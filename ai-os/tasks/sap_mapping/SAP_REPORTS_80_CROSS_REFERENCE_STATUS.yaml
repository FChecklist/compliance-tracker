real_storage_locations:
  sap_reports_table: >-
    NOT in this repo (compliance-tracker) and NOT a Postgres table -- confirmed via git log --all,
    find, and direct grep of src/lib/db/schema.ts (zero hits for sap_reports/sapReports anywhere).
    It is a SQLite table at /opt/veridian/ai-os/memory/sap_mapping.sqlite (shared, non-git,
    cross-session infra state on the host). 80 rows, columns include report_name,
    sap_transaction_code, business_purpose, calculation_logic, veridian_mapping_status,
    veridian_existing_equivalent, veridian_gap_notes, engine_track, priority. Two dated backups
    sit alongside it (sap_mapping.sqlite.bak-pre-engine_track-20260728,
    sap_mapping.sqlite.bak-pre-veridian-mapping-20260728) from the two write sessions below.
  vcel_calculation_engine_registry: >-
    Postgres compliance.computation_engines (src/lib/db/schema.ts:9488, table 'computation_engines'),
    backed by the 25 real files under src/lib/engines/*.ts. This is the VCEL catalog the SPEC refers
    to -- not a JSON file, not assumed.
  report_definitions: >-
    Postgres compliance.report_definitions (src/lib/db/schema.ts:4650), seeded via
    drizzle/0180-0183_*.sql and executed/dispatched through report-engine-service.ts's
    FORMULA_REGISTRY / TABLE_REGISTRY / AI-recipe executor (see that file's own header).
  wiring_registry: >-
    NOT in this repo. Lives in the SEPARATE claude-control repo:
    /opt/veridian/repos/claude-control/ai-os/WIRING_ENGINE_REGISTRY_2026-07-25.json (~5.8MB,
    confirmed present there, confirmed absent here). Tracks AI-OS/platform wiring (7711 entities:
    function/file/supabase_table/ai_role/engine/route/etc.), not a per-SAP-report business registry
    -- useful only as corroborating evidence that a given engine is genuinely wired end-to-end, not
    as the primary source for a per-report verdict.

