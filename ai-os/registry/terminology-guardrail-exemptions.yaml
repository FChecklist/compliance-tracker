# ratchet scoped to 4 priority directories of .ts/.tsx code (Phase 2's baseline). Real
# investigation this phase found that of the 500 findings the prior manifest carried, only 2
# were ever migrated to a registered placeholder -- the remaining 498 are PERMANENT
# (confirmed-false-positive hardcoded_iso_date matches, or explicitly-out-of-scope seed/test
# fixtures), not debt anyone intends to pay down. "Retiring" that manifest by deleting it
# outright would not produce a working full-repo-scan gate -- it would just fail CI
# immediately on all of that legitimate content, plus every new match the widened
# .md/.yaml/.json file-type scope (this phase's own scope item 2) surfaces. So instead: this
# file is now a COMPLETE, CURRENT, full-repo baseline (every scannable file in the repo, not
# just 4 priority directories) generated from one real end-to-end scan
