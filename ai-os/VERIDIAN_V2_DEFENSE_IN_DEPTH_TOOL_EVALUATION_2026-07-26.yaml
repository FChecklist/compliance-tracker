tools:
  - id: llama-guard
    document_name: Llama Guard 3 / Llama Guard 4
    category: Security (Runtime Guardrails, Layer 3; Content Moderation, Layer 4)
    tool_mapping: 'Not an npm/pip package -- a hosted safety-classifier MODEL. Confirmed live via WebFetch
      (console.groq.com/docs/model/llama-guard-4-12b, 2026-07-26): "Llama Guard 4 is available on Groq...
      Model ID: meta-llama/llama-guard-4-12b... specifically fine-tuned for content moderation and safety
      classification tasks."'
    tool_installable_compatible: 'YES, zero new install. Groq is already provider "groq" in llm-client.ts
      (callLLM("groq", model, apiKey, systemPrompt, userMessage)) -- model is a caller-supplied string with
      no allowlist, dispatched over the standard OpenAI-compatible /chat/completions shape every other Groq
      model already uses. GROQ_API_KEY is present in this session''s environment (confirmed via env, value
      not echoed).'
    custom_work_required: 'A response parser for Llama Guard''s "safe" / "unsafe\n<comma-separated hazard
      category codes>" two-line output convention (the standard Llama Guard output format across the 3/3.1/4
      model line) -- src/lib/prompt-security/layer3-runtime-guardrails.ts. No SDK, no model download, no
      GPU.'
    verdict_this_phase: ADOPTED -- Layer 3 (runtime guardrails, evaluates compiled prompt) and Layer 4
      (content moderation on model output), via src/lib/prompt-security/layer3-runtime-guardrails.ts.

  - id: prompt-guard
    document_name: Prompt Guard (Meta)
    category: Security (Injection Detection, Layer 1)
    tool_mapping: 'Not an npm/pip package for our use -- a hosted classifier MODEL (current generation:
      Prompt Guard 2). Confirmed live via WebFetch (console.groq.com/docs/model/meta-llama/llama-prompt-guard-2-86m,
      2026-07-26): real chat-completions request/response shape, model id meta-llama/llama-prompt-guard-2-86m.
      Note (real, not silently smoothed over): Prompt Guard 2 collapses the original 3-label taxonomy
      (benign/injection/jailbreak) to 2 labels (BENIGN/MALICIOUS) -- less granular than the document''s own
      Layer 1 description, but still a real classifier signal.'
    tool_installable_compatible: 'YES, zero new install -- same Groq provider/shape as llama-guard above.'
    custom_work_required: 'A response parser for the BENIGN/MALICIOUS text-classification output. Positioned
      as the network-dependent second opinion LAYERED ON TOP OF (not replacing) a network-independent
      deterministic regex/invisible-unicode-anomaly detector, so Layer 1 still functions with zero added
      latency/cost/network-dependency when a caller opts out of the model-classifier call -- matching this
      codebase''s own guardrail-engine.ts precedent ("Deterministic only -- no LLM call, matching every other
      gate in this codebase") for the always-on baseline path.'
    verdict_this_phase: ADOPTED (deterministic path is the primary/always-on Layer 1 mechanism; the Groq
      Prompt Guard 2 call is an optional network-dependent enrichment, not a hard dependency), via
      src/lib/prompt-security/layer1-input-sanitization.ts.

  - id: garak
    document_name: Garak
    category: Security (Adversarial Testing / Red Team Engine)
    tool_mapping: 'NVIDIA''s real OSS automated LLM red-teaming CLI (github.com/NVIDIA/garak). pip-installable,
      standalone binary, same class as AUDITOR_ENGINE_PHASE_PLAN''s gitleaks/trivy/checkov (a repeatable-cadence
      scanner, not a service to stand up).'
    tool_installable_compatible: 'CONFIRMED YES, live in this session: `python3 -m venv /tmp/garak-venv &&
      pip install garak` completed successfully; `garak --version` returned "garak LLM vulnerability scanner
      v0.15.1"; `garak --model_type groq --model_name llama-3.1-8b-instant --probes promptinject.HijackHateHumans`
      confirmed garak can target Groq (a provider already live in this stack via GROQ_API_KEY) directly --
      the run itself was not completed to conclusion within this evaluation pass''s time budget (a live
      multi-generation probe run legitimately takes several minutes; killed at 90s, not a failure, an honest
      time-box).'
    custom_work_required: 'A full live-scan cron wrapper (mirroring audit_pipeline_security.py''s subprocess +
      finding-normalization pattern) targeting compliance-tracker''s own live model endpoints, with real
      run-time long enough (minutes, not seconds) to matter for a cron SLA, and Owner sign-off on the outbound
      API spend a real adversarial probe battery incurs against a live provider on a recurring cadence.'
    verdict_this_phase: 'INSTALLABLE, CONFIRMED WORKING -- but NOT adopted as this phase''s live cron-wired
      scanner (deferred, honestly, as a real follow-up gap, not silently dropped). This phase instead ships
      a zero-cost, zero-network, immediately-runnable Red Team Engine: a curated adversarial-prompt battery
      (src/lib/prompt-security/red-team-battery.ts) whose payload CATEGORIES are sourced from garak''s own
      published probe taxonomy (promptinject, dan, encoding, leakage, xss/malwaregen-style requests) --
      reusing garak''s real, published attack-category method without requiring garak''s own runtime dependency
      for every CI/test run, the same "reuse the METHOD, not necessarily the exact runtime" precedent
      WIRING_ENGINE_PHASE_PLAN_2026-07-25.yaml phase_9 already established for this system.'

  - id: pyrit
    document_name: PyRIT (Microsoft)
    category: Security (Adversarial Testing / Red Team Engine)
    tool_mapping: 'Microsoft''s real OSS Python Risk Identification Toolkit for red-teaming LLMs
      (github.com/Azure/PyRIT). pip-installable, but an orchestration FRAMEWORK (multi-turn attack
      orchestrators, memory/database backing, converter/scorer pipeline) rather than a standalone CLI --
      a heavier integration shape than garak''s single-binary model.'
    tool_installable_compatible: 'NOT independently verified this pass (time-boxed: garak and Presidio were
      each confirmed live; installing a second, overlapping red-team framework in the same pass would not
      have added a new real Layer 1-4 capability beyond what garak + the custom battery already cover).'
    custom_work_required: 'Full orchestrator/converter/scorer wiring plus its own memory backend -- a
      materially larger lift than garak''s standalone-CLI shape for the same underlying requirement
      (engine-red-team: "automated adversarial testing").'
    verdict_this_phase: DEFERRED -- real overlap with garak for this phase''s scope (both satisfy
      engine-red-team); garak is the lighter-weight, session-confirmed-working choice. Installing both would
      be redundant tooling for the same requirement, not additional real coverage.

  - id: presidio
    document_name: Presidio (Microsoft)
    category: Privacy (PII Detection, Layer 4 Output Filtering)
    tool_mapping: 'Microsoft''s real OSS PII detection/anonymization library (presidio-analyzer +
      presidio-anonymizer), spaCy-backed NER + regex/checksum recognizers (email, phone, SSN, credit card,
      etc).'
    tool_installable_compatible: 'CONFIRMED YES, live in this session: `pip install presidio-analyzer
      presidio-anonymizer` completed (pulls a spaCy en_core_web_lg model, ~400MB download, confirmed
      completed and loadable: AnalyzerEngine() initialized OK). Real detection confirmed against a live
      sample string: "Contact John Smith at john.smith@example.com or 555-123-4567, SSN 123-45-6789." ->
      EMAIL_ADDRESS (score 1.0), PERSON (0.85), PHONE_NUMBER (0.4) all correctly flagged (the SSN pattern was
      NOT flagged by the default en recognizer on this exact string shape -- a real, honestly-reported gap in
      Presidio''s own default US-SSN recognizer, not a claim of perfect coverage).'
    custom_work_required: 'The document''s own integration note says "Presidio (browser-adapted)" -- Presidio
      itself is server/Python-only (no WASM/browser build exists), so a genuine browser-side L4 (per phase_5''s
      browser execution tiers) would need either a services/doc-processing/-hosted HTTP endpoint (server-side
      only, not what the document actually asks for) or an entirely different browser-native NER approach
      (e.g. Transformers.js, phase_5''s own engine-browser-transformers scope) -- real, substantial follow-up
      work, not a same-phase fit. Also: the 400MB spaCy model download is a real deployment-footprint concern
      for a Vercel serverless function (cold-start/bundle-size), not evaluated further this pass.'
    verdict_this_phase: 'CONFIRMED REAL AND WORKING, but NOT adopted as a live server-side dependency this
      phase (deferred, honestly, as a real follow-up -- likely phase_5/phase_6''s browser-execution-tier
      scope, per the document''s own "browser-adapted" framing). This phase instead ships a deterministic
      regex-based PII scrubber (email/phone/SSN/credit-card patterns) in
      src/lib/prompt-security/layer4-output-filtering.ts as the immediately-real, zero-new-dependency Layer 4
      PII-scrub baseline, with Presidio named here as the concrete, session-verified upgrade path once the
      browser-adapted requirement is actually being built.'

  - id: nemo-guardrails
    document_name: NeMo Guardrails (NVIDIA)
    category: Security (Runtime Guardrails, programmable input/output rails)
    tool_mapping: 'NVIDIA''s real OSS programmable-guardrails framework (github.com/NVIDIA/NeMo-Guardrails),
      pip-installable (nemoguardrails package), but requires authoring its own Colang 2.0 rail-flow
      configuration and runs its OWN LLM calls internally (a self-contained rails-execution runtime, not a
      stateless classifier call like Llama Guard/Prompt Guard above).'
    tool_installable_compatible: 'NOT independently verified this pass (time-boxed, same reasoning as PyRIT):
      even if pip-installable in isolation, its real integration cost (Colang authoring + its own async
      LLM-orchestration runtime living somewhere -- services/doc-processing/ is the only real Python surface
      in this stack, and it is a document-processing microservice, not an LLM-orchestration one) is
      substantially larger than the Groq-hosted-model path this phase already adopted for the identical
      requirement (Layer 3 runtime guardrails).'
    custom_work_required: 'Colang 2.0 rail-flow authoring (none exists), a place to run its own
      LLM-orchestration runtime, and reconciling its rails against this phase''s already-adopted Llama Guard
      call for the same Layer 3 requirement -- would be parallel, overlapping infrastructure for the same
      gap item, not additional real coverage.'
    verdict_this_phase: DEFERRED -- real overlap with the already-adopted Llama Guard 4 path for Layer 3
      (both satisfy "Input Guardrails, powered by NeMo Guardrails OR Llama Guard" per the document''s own
      Stage 6 wording, line 235 of the extracted source -- the document itself treats these as alternatives,
      not both-required).

