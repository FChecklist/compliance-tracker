    - id: GAP-VERI-CHAT-CONFIDENCE-LABEL-NO-REFUSAL-DETECTION
      name: "messages.confidence_label defaults to \"high\" for genuine LLM refusals -- the confidence heuristic has zero refusal-language coverage, so it is not a reliable reply-quality signal"
      old_ids: []
      detail: |
        Real, live finding, `UMR-20260802-165606-4413` (OCID-020), discovered alongside
        `GAP-VERI-CHAT-PURPOSE-CLAUSE-SCOPE-CONTRADICTION` during the same real OCID-052 Item 3 test.
        The real refusal reply ("Boss, I'm sorry—I can't help with that.") was persisted with
        `confidence_label = "high"`. Root-caused directly: `deriveConfidenceLabel()`
        (`src/lib/floor-tier-escalation.ts:116-120`) only returns `"low"` if `detectLowConfidenceResponse()`
        (same file, lines 49-55) matches a narrow, fixed phrase list ("I'm not sure," "I don't know," etc.)
        -- that list has zero refusal-language coverage, so any genuine model refusal that doesn't happen
        to also contain one of those exact hedge phrases defaults straight to `"high"`.

        This directly matters for OCID-052's own Item 4 (UI-distinguishability): the planning doc already
        flagged `confidenceLabel` as an unintentional-but-real signal for deterministic-vs-AI
        distinguishability; this finding shows it is additionally unreliable as a *quality* signal for
        AI-generated replies specifically -- a refused/unhelpful reply looks identical, confidence-wise,
        to a genuinely confident, correct one.
      size: "XS-S -- extend detectLowConfidenceResponse()'s phrase list with refusal-language patterns
        (e.g. \"I can't help with that,\" \"I'm not able to,\" \"outside my scope\"), or add a distinct
        boolean/enum for refusal detection rather than overloading the confidence label"
      recommendation: |
        Extend `detectLowConfidenceResponse()` (or add a sibling `detectRefusalResponse()`) to recognize
        real refusal phrasing, so refused replies are not indistinguishable from genuinely confident ones
        in the persisted data. Worth fixing together with
        `GAP-VERI-CHAT-PURPOSE-CLAUSE-SCOPE-CONTRADICTION` since a correct fix there should reduce how
        often this path is even exercised, but the confidence-heuristic gap is real and separate
        regardless of that fix.
      status: "closed 2026-08-30 (R1-R64 recheck) -- extended LOW_CONFIDENCE_PHRASES
        (floor-tier-escalation.ts) with real refusal-language patterns (\"i can't help with
        that,\" \"i'm not able to,\" \"outside my scope,\" \"i'm not allowed to,\" etc.), per this
        gap's own recommended fix shape. Added a regression test reproducing the exact live
        refusal reply that surfaced this gap (\"Boss, I'm sorry-I can't help with that.\") plus 3
        other common refusal phrasings -- all now correctly detected, deriveConfidenceLabel()
        downgrades them from the previous incorrect \"high\"."
      first_raised: "This session, 2026-08-03, real live test during OCID-052 execution (UMR-20260803-142956-d931, UMR-20260802-165606-4413 OCID-020)"

