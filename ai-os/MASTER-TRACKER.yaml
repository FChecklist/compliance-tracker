          ai-os/CONSTITUTION.yaml's learning_and_umr section) -- running
          semantic similarity matching client-side, in-browser, before
          falling back to a server round-trip / AI planning call. Not
          scoped or built -- named as a lead worth pursuing together with
          that gap, not a green light to build either in isolation.
        - Explicitly NOT the same problem as "most-used calculator loads
          in browser" (a separate Owner ask, ai-os/CONSTITUTION.yaml's
          end_user_experience section): VERIDIAN's VCEL calculators
          (EMI/GST/depreciation/etc., src/lib/engines/*.ts) are plain
          deterministic math, not ML models -- they need zero LiteRT.js
