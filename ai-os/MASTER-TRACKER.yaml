        - STILL CONFIRMED NOT SUITABLE for in-browser LLM chat: the
          announcement itself names LLM support as a SEPARATE product,
          "LiteRT-LM.js" -- not evaluated, not the same library. Do not
          conflate the two when scoping any future LiteRT work.
        - Real, promising fit found this pass, not previously identified:
          LiteRT.js's embeddings/vector-search capability is a genuine
          candidate mechanism for the separately-tracked "chat instruction
