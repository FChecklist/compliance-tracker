      old_ids: []
      detail: |
        Real finding, OCID-038/039/040 real end-user testing pass
        (`UMR-20260803-072940-6a88`,
        `ai-os/VERIDIAN_OCID_038_039_040_REAL_DISCOVERY_AND_END_USER_VERIFICATION_2026-08-03.md`
