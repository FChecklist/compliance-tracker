ition (startApprovalWorkflow() resolves a workflow definition by org + entityType 'tasks' org-wide, not per-chain, so there's no chokepoint that picks a specific definition for a specific chain), and dynamic_chain -> knowledge_base_page (no 'attach documentation' step exists anywhere in the Chain Selector or chain-creation flow). Consistent with this gap's own established discipline (0 rows to backfill, forward-only, no fabricated chokepoints), these stay columns settable only via the existing versions API until a real consumer/chokepoint exists. tsc/lint/bun test all clean (1113 pass / 0 fail) as of this pass's own commits. Still not closed: governance sub-field remains at its Priority 9 depth (governanceNotes only, out of scope this pass); no new entity_relationships edge types were added (0 new graph edges this pass, 7 new columns instead). REBASE NOTE (this same PR, after PR #327/#329 merged first): this PR's original drizzle/0198 collided with PR #327's drizzle/0198_gap_umr_batch5_onboarding.sql, which merged first -- renumbered to drizzle/0199_gap_dcmd_rich_schema_slice.sql (0199 confirmed free on origin/main and against all other open PRs at renumbering time). Also merged origin/main in, which brought in PR #329's fix below (disjoint fields, both kept, resolved as a real but non-semantic textual conflict in createChainVersion()'s copy-forward block, exactly as PR #329's own status_update predicted)."
