        by a genuinely concurrent session (`task-20260804-235321-independently-re-verify-group-f-ocid-047`,
        registered on a branch that was never opened as a PR and so never reached `main`). Real
        Playwright reproduction (3/3 trials, fresh admin users each time) confirmed: the Profile
        section renders permanently empty (avatar "??", name "--", role "Member") and the
        Subscription Plan tab's content never appears (gated on the same null-derived `isAdmin`),
        even though clicking the tab itself works correctly. Root cause, confirmed via direct
        network instrumentation: `GET /api/me` intermittently returns a real HTTP 200 with every
        field null (`id`/`name`/`email`/`orgId` all null) immediately after login -- a transient
        server-side session-resolution race (this page fires `/api/me` alongside other on-mount
        authenticated fetches; a concurrent Supabase session-refresh attempt across simultaneous
        requests can leave exactly one of them seeing a not-yet-resolved session), not a permanent
        auth failure. The old code took that null response at face value with zero retry.
      size: S
      recommendation: |
