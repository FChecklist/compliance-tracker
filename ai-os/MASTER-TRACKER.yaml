    - id: GAP-REVIEWER-FALSE-DUPLICATE-AFTER-MAIN-MERGE
      name: "Superboss review (scripts/supervisor-entrypoint.sh's Claude-driven reviewer) has a
        reproducible false-positive pattern: it sometimes rejects a genuinely new, non-duplicate
        diff as 'a complete duplicate of work already merged into main' when the reviewed
        branch's own git history contains a recent 'Merge remote-tracking branch origin/main
        into HEAD' commit (severity: medium -- wastes real review cycles and requires a manual
        retrigger to get a correct verdict, but does not itself cause an incorrect merge, since
        the failure mode is always a false REJECT, never a false approve)"
      old_ids: []
      detail: |
        Real, directly observed, two independent confirmed instances in the same session
        (2026-08-03), both on branches that had just had 'git merge origin/main --no-edit' run
        on them to resolve a real, legitimate PROGRESS.md/ai-os-index merge conflict (the
        append-only-doc collision pattern that recurs whenever two sibling OCID-series PRs touch
        the same shared files), then were retriggered for review:

        Instance 1 (claude-control-adjacent, compliance-tracker PR #776, round 2 of its review):
        verdict was 'reject', summary claimed the diff 'is a complete duplicate of work already
        merged to this branch: commits 2fd55bd1 and de8f4add are already at HEAD' -- true but
        irrelevant (those are the PR's OWN commits, trivially always 'already at HEAD' of their
        own branch; the reviewer conflated 'reachable from HEAD' with 'reachable from
        origin/main'). Independently re-verified: 'git diff --stat origin/main -- <file>' at
        review time showed 27 insertions/6 deletions, a real, non-empty, non-duplicate change.
        Retriggering a fresh review (no code change, same diff) produced a correct 'approve' on
        the next attempt.

        Instance 2 (compliance-tracker PR #774, round 3 of its review, immediately after a real
        'git merge origin/main --no-edit' was performed to resolve a genuine PROGRESS.md/OS.yaml
        conflict caused by PR #781 merging first): verdict was 'reject', summary claimed 'This
        diff is a complete duplicate of work already merged into main: PR #774 ... already
        created ai-os/VERIDIAN_UNIFIED_SYNCHRONIZATION_RUNTIME_2026-08-03.md ... confirmed
        present ... in the current workspace's main branch'. Independently re-verified
        immediately after: 'git diff --stat origin/main...HEAD' (the exact three-dot diff
        supervisor-entrypoint.sh's own REVIEW_PROMPT computes and embeds) showed 626 real
        insertions across 4 files, and 'git cat-file -e origin/main:<the doc path>' returned
        'fatal: ... exists on disk, but not in origin/main' -- i.e. the file provably does NOT
        exist on origin/main, directly contradicting the reviewer's own claim. This PR's
        real reviewer this round had `--dangerously-skip-permissions` tool access (per
        supervisor-entrypoint.sh's REVIEW_PROMPT construction) and likely ran its own ad hoc
        `git log`/`git show` commands inside the workspace to 'independently verify' -- but
        after a merge-from-main, the workspace's own `git log` trivially contains every
        origin/main commit as an ancestor of HEAD, so any check phrased as 'is commit X
        reachable from HEAD' (rather than specifically 'is commit X reachable from
        origin/main, excluding this branch's own new commits') will always incorrectly report
        'already merged' for a freshly-merged-from-main branch, regardless of whether the
        branch's OWN new content is genuinely new.

        Both instances self-resolved on a plain retrigger (archive review.json, restart the same
        systemd unit, no code change) -- confirming the diff embedded in REVIEW_PROMPT itself
        (git diff origin/$DEFAULT_BRANCH...HEAD, computed via supervisor-entrypoint.sh's own
        deterministic git command) was correct both times; only the reviewer's own
        supplementary, unprompted tool use produced the wrong conclusion, and that reasoning
        error was not consistent across independent attempts (retry got the right answer both
        times).
      size: "S -- likely fixable by adding one explicit sentence to REVIEW_PROMPT in
        scripts/supervisor-entrypoint.sh: 'If this branch's history includes a merge of
        origin/$DEFAULT_BRANCH into HEAD, do not use plain `git log`/`git show` reachability
        from HEAD to judge what is already on main -- the diff already provided above
        (origin/$DEFAULT_BRANCH...HEAD) is the authoritative, correct scope; trust it over any
        ad hoc git history check you perform yourself.'"
      recommendation: |
        Fix in claude-control (scripts/supervisor-entrypoint.sh's REVIEW_PROMPT construction),
        not compliance-tracker. Add a regression fixture: a branch with a real
        'git merge origin/main --no-edit' commit in its history plus one genuinely new file not
        present on origin/main, run through the real review prompt (or a recorded transcript
        replay if a live-model regression test isn't practical), asserting the verdict does not
        cite 'already merged'/'duplicate' for content confirmed absent from origin/main via
        'git cat-file -e origin/<default>:<path>'. Until fixed: any adopted-task retrigger whose
        workspace was merged-from-main immediately before that retrigger should be treated as a
        higher-than-usual candidate for a false-reject and worth one free retry before treating
        a reject as a real finding requiring a code/content fix.
      status: "moot 2026-08-30 (R1-R64 recheck) -- the reviewer this bug lived in
        (scripts/supervisor-entrypoint.sh's Claude-driven review, systemd-unit-based) is no
        longer active for anything: confirmed via `grep -rl supervisor-entrypoint .github/`
        (zero hits -- no current GitHub Actions workflow invokes it) and a repo-wide reference
        search (only old, already-superseded governance markdown files mention it). Casualty of
        the PM-hierarchy/dispatch-fleet apparatus this reviewer belonged to, superseded by the
        VERIDIAN-DEV server decommission (2026-08-25, see feedback_bypass_server_direct_work
        memory) -- not fixed, just no longer live infrastructure to regress."
      first_raised: "compliance-tracker PR #776/#774 re-review rounds, 2026-08-03"

