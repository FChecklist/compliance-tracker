        lines 183-199. A fresh self-signup org (real signup on
        `projexa-ai.com/signup`, real Admin-API email-confirm bypass, real
        login) sees its `/crm` and `/erp/*` page shells render, but every real
        backing API call `403`s:
          - `/crm`: `/api/crm/leads`, `/api/crm/accounts`, `/api/crm/campaigns`,
            `/api/crm/contacts`, `/api/crm/opportunities` (screenshot
            `ocid020-redo-33-crm.png`)
          - `/erp/procurement`: `/api/erp/procurement/quotations`,
            `/requisitions`, `/rfqs`
          - `/erp/journal-entries`: `/api/erp/buying/suppliers`,
            `/api/erp/accounts`, `/api/erp/cost-centers`,
            `/api/erp/journal-entries`, `/api/erp/companies`
        Real reproduction path: sign up fresh -> confirm email -> log in ->
        click "CRM" or any ERP nav item in the left nav -> page shell loads,
        but every list/table on the page silently shows empty with no
        explanation.
        Root cause is plausibly correct, safe-by-default behavior, not a bug
        in isolation -- consistent with the parent matrix's own
        `erp-enablement-service.ts` `requireErpEnabled()` gate finding: ERP/CRM
        modules are not enabled by default for a brand-new org. What IS a real
        gap: the real UI gives no visible "module not enabled, contact your
        admin to enable this" messaging anywhere on these pages -- a real
        self-signup user just sees empty-looking ERP/CRM screens with zero
        explanation for why, which reads as broken even though the
        underlying access gate is working as designed.
      size: deferred_medium
      recommendation: |
        Not urgent (no data-integrity or security risk -- the gate itself is
        correct and fail-closed). When picked up: the fix belongs at the UI
        layer, not the gate -- have the CRM/ERP page shells detect a 403 with
        a module-not-enabled reason (or check module-enablement status
        up-front via an existing settings/entitlements call) and render a
        real "this module isn't enabled for your organisation yet -- contact
        your admin" empty-state instead of a silently-empty list/table.
        `requireErpEnabled()`'s existing 403 response shape should be checked
        first to see if it already carries a machine-readable reason code the
        client can key off, before inventing a new one.
      resolution_note: |
        **FIX MERGED 2026-08-03 (`UMR-20260803-111057-20a8`).** First
        investigated exactly the recommendation's own open question: does
        `requireErpEnabled()`'s 403 already carry a real reason, or is the
        backend silent? Read `erp-enablement-service.ts` directly --
        `requireErpEnabled()` already throws `ServiceError("This capability
        is not part of the Module your organization purchased. Please
        contact your organization's administrator...", 403)`, a real,
        specific, human-readable message (Owner's own exact wording per
        that file's 2026-07-13 comment), and every route already forwards
        it via `NextResponse.json({ error: error.message }, { status:
        error.status })`. **The backend was never silent -- this was purely
        a frontend surfacing gap**, confirming the fix belongs at the UI
        layer as the original recommendation guessed.

        Searched the existing codebase for the established UI pattern
        before building anything new, per the standing instruction not to
        invent one: `src/app/(app)/pms/page.tsx` already solves the
        identical problem for the PMS module -- checks enablement up-front
        via `/api/me`'s `pmsEnabled` field, and renders a `Card` (icon +
        "X is not enabled" heading + explanation + "Go to Settings" button)
        instead of the real page when disabled. This is the exact,
        already-established pattern reused here, not a new one.

        Real fix: added `erpEnabled`/`salesEnabled` to `/api/me` (backed by
        the same `isErpEnabledForOrg()`/`isSalesEnabledForOrg()` functions
        the API routes themselves already use, so the two can never
        disagree); extracted PMS's exact card markup into a shared
        `src/components/ModuleNotEnabledCard.tsx` (not a new pattern, the
        same one factored for reuse); wired it into the 6 CRM pages
        (`crm/page.tsx` hub + `leads`/`accounts`/`campaigns`/`contacts`/
        `opportunities`) and the 2 explicitly-named ERP pages
        (`erp/procurement`, `erp/journal-entries`) named in this gap's own
        real reproduction evidence -- each page's existing data-fetch logic
        is untouched (still fires, still harmlessly 403s in the background),
        only the render path changes: a real explanation card instead of a
        silently-empty table when the module isn't enabled.

        Honest scope note: the gap's own detail names `erp/journal-entries`
        as the page for `/api/erp/buying/suppliers`, `/api/erp/accounts`,
        `/api/erp/cost-centers` -- confirmed those are the same page's own
        account/cost-center dialogs, covered by this same fix. The broader
        ERP surface has ~17 more pages sharing the identical
        `requireErpEnabled()` gate and the identical missing-explanation
        gap (e.g. `erp/inventory`, `erp/invoicing`, `erp/payroll`) --
        deliberately out of this pass's scope (not named in this gap's own
        reproduction evidence), but the exact same 3-line fix (one new
        `useState`, one new `useEffect`, one early-return using the same
        `ModuleNotEnabledCard`) now exists as a real, reusable pattern for
        whoever picks those up next.

        **Live re-verification completed 2026-08-03, once the Vercel deploy
        landed** (same deploy as `GAP-403-VS-500-CLM-HR-PERFORMANCE`,
        confirmed via `gh api .../commits/<sha>/status` showing `Vercel:
        success` for merge commit `536bdd6f65a0b1a2acded3b77a539c78c1010f81`).
        Real, direct verification against the live site with the same fresh
        `OCID-020 Continue Org A` test org: (1) confirmed `/api/me`'s raw
        JSON response for this org shows `erpEnabled: false, salesEnabled:
        false` (fetched directly, not narrated); (2) navigated to
        `/erp/procurement`, `/erp/journal-entries`, `/crm`, `/crm/leads`,
        `/crm/accounts` and read the real DOM `document.body.innerText` on
        each -- all 5 contain the real explanation text ("... is not
        enabled" / "Ask an organisation admin to enable it from Settings
        ..."). Real screenshot captured with the explanation card scrolled
        into view (the app's own content area scrolls independently of
        `document.body`, so a naive `fullPage` screenshot missed it on the
        first attempt -- caught and corrected, not silently accepted):
        `/opt/veridian/browser/screenshots/ocid020-continue/ux-fix-real-erp-not-enabled-card.png`
        shows the real rendered card (rocket icon, "ERP is not enabled",
        the real explanation text, and a working "Go to Settings" button)
        in place of the previously-silent empty procurement page.
      status: resolved
      first_raised: "OCID-020 redo, 2026-08-02 (UMR-20260802-165606-4413)"
      resolved: "2026-08-03 (UMR-20260803-111057-20a8) -- fix merged and
        independently re-verified live against the real deployed site
        (real DOM text checks + a real screenshot); backend already had a
        real 403 message, this was purely a frontend surfacing gap, fixed
        by reusing PMS's own existing enablement-card pattern"

    - id: GAP-MIGRATION-APPLY-NOT-AUTOMATED
      name: "Deploy pipeline never automatically applies pending Drizzle migrations to production; CI only checks migration NUMBER collisions, never whether a migration's DDL actually ran (severity: medium-high, real incident already occurred)"
      old_ids: []
      detail: |
        Real, distinct systemic gap, separate from the specific incident it was
        found by fixing -- see `ai-os/boss/COMPLETED.yaml` id
        `MIGRATION-DRIFT-0264-EMAIL-INTEL-500-FIX` (retroactively authorized,
        `UMR-20260803-012711-18b4`, citing `UMR-20260802-134939-145d`) for the
        real incident this gap was discovered from: `drizzle/0264_helpdesk_tiered_sla_team_routing.sql`
        was recorded as applied in `drizzle.__drizzle_migrations` but its DDL
        never actually ran on the live production database, causing a real,
        live, user-facing `500` on `GET /api/email-intelligence` for every
        user, found during a certification sweep rather than caught before
        reaching a real user.
        Root cause of the systemic gap, confirmed by direct inspection, not
        assumed: `vercel.json`'s `installCommand` is `bun install` only; no
        build/deploy step anywhere in this repo runs `bun run db:migrate` or
        `drizzle-kit push` against the production database. The only existing
        CI guard, `scripts/check-migration-collision.mjs`, explicitly and only
        checks that two NEW migration files don't share the same leading
        number prefix -- it says nothing about whether a migration's DDL was
        ever executed against the live DB. So a migration can be committed,
        merged, and recorded as "applied" in the ledger (by whatever manual
        process records that) while never actually running live, with no
        automated check anywhere in the pipeline that would catch the
        divergence before a real user hits the resulting real error.
        A bounded (not exhaustive) spot-check of 9 other migrations in the
        journal (0038-0311) for this same pattern found none -- so this is not
        currently known to be a widespread active problem, but the pipeline
        gap that allowed it to happen once, undetected, until a live user was
        affected, remains real and unfixed.
      size: "M -- likely a real CI job comparing drizzle.__drizzle_migrations
        against information_schema for each migration's expected real DDL
        artifacts, or a scheduled drift-check script; needs real design, not
        a one-line fix"
      recommendation: |
        Not urgent enough to block other work, but real and should not be
        deprioritized indefinitely given a real user-facing outage already
        happened from it once. When picked up: a real, automated post-deploy
        or scheduled check that verifies each migration ledger row's DDL
        actually exists live (e.g. spot-check expected tables/columns per
        migration, or a more general drift-detection query), distinct from
        `check-migration-collision.mjs`'s narrower number-collision check.
      status: "closed 2026-08-30 (R1-R64 recheck) -- built scripts/check-migration-schema-drift.mjs
        (distinct from check-migration-integrity.mjs/AR-12, which only proves the migration FILE's
        bytes still match the ledger, not that the DDL actually exists live). Parses CREATE TABLE /
        (multi-clause) ALTER TABLE ADD COLUMN, replays add/drop in journal order, checks
        schema-agnostically against information_schema (tolerates a legitimate post-migration
        schema move, e.g. the real confirmed compliance.worker_agents -> platform.worker_agents,
        same class of move already closed for product_branches). Verified against real production
        data before landing: 458 expected tables + 356 expected columns parsed from all 305 real
        migration files, zero missing live. Wired into ci.yml as migration-schema-drift-check.
        Would have caught the exact real 0264/email-intelligence incident this gap was raised
        from -- confirmed via a dedicated regression test reproducing that migration's own DDL
        shape."
      first_raised: "OCID-020 certification sweep, 2026-08-03 (UMR-20260802-165606-4413, UMR-20260803-012711-18b4)"
      related_but_distinct: |
        Real cross-reference, added 2026-08-03 (`UMR-20260803-025317-0c64`,
        amended `UMR-20260803-025414-8274`): a new Category B deterministic-
        recovery Kernel policy gate now exists (`claude-control` repo,
        `scripts/ddl_authorization_check.py::check_category_b_recovery()`,
        also `ai-os/CONSTITUTION.yaml`'s new `SEC-06`) -- but it solves a
        DIFFERENT problem than this gap. This gap is about automated DRIFT
        DETECTION (does a migration's DDL actually match what the ledger
        claims, checked proactively/on a schedule). The new gate is about
        deterministic RECOVERY AUTHORIZATION (once drift is found, by
        whatever means, is it safe to auto-authorize reapplying the
        already-reviewed fix without a human/PM/AI judgment call). This gap
        stays genuinely OPEN -- the new gate does not close it, and this
        note exists specifically so the two are not mistaken for the same
        fix. Real, honest test of the new gate against this gap's own
        originating incident (`MIGRATION-DRIFT-0264-EMAIL-INTEL-500-FIX`,
        `ai-os/boss/COMPLETED.yaml`): 9 of its 10 required conditions pass
        against real evidence; condition 9 (rollback path documented)
        genuinely fails, since no rollback plan was ever written for that
        migration -- see that entry's `category_b_retroactive_test` field
        for the full breakdown.

    - id: GAP-EMAIL-INTELLIGENCE-500-VS-403
      name: "GET /api/email-intelligence returns 500 instead of 403 for a module-not-enabled org (severity: low-medium) -- RESOLVED, see resolution note"
      old_ids: []
      detail: |
        Real finding, OCID-020 continuation sweep (`UMR-20260802-223152-0b6a`,
        task-20260802-231454's background mega-script run, read and reported
        by the PM-decision task that unblocked it -- see
        `ai-os/PROJEXA_AI_COM_E2E_CERTIFICATION_CONTINUATION_2026-08-02.md`
        Part 3). Reproduced live: a fresh self-signup org (real signup,
        real Admin-API email-confirm bypass, real login) loading `/crm` or
        an ERP page triggers a page-initiated `GET /api/email-intelligence`
        call that returns `500`, while every sibling gated endpoint on the
        same page (`/api/crm/leads`, `/api/erp/procurement/*`, etc.)
        correctly returns `403` for the same not-enabled org. The page
        itself still renders and functions -- this is a background/widget
        call, not a page-blocking crash, so severity is lower than the
        departments-500 fix (Finding A) that got an immediate ship.
        Root cause not yet investigated -- `listEmailIntelligenceItems()`
        (`src/lib/services/email-intelligence-service.ts`) returns `{items:
        []}` when `!orgId` but otherwise queries the DB directly; the 500
        is plausibly a real query/tenant-context error for a brand-new org
        rather than a missing entitlement gate (unlike CRM/ERP, this route
        has no `requireErpEnabled()`-style check at all).
      resolution_note: |
        **RESOLVED, live-reverified 2026-08-03.** PR #757's own audit
        (`AUDIT: FAIL`) correctly flagged this finding was captured
        2026-08-02 23:25-23:31, ~53 minutes *before* the live migration-0264
        fix (`MIGRATION-DRIFT-0264-EMAIL-INTEL-500-FIX` in
        `ai-os/boss/COMPLETED.yaml`, applied 2026-08-03T00:24Z) re-applied
        `drizzle/0264_helpdesk_tiered_sla_team_routing.sql`'s DDL directly
        against prod -- adding the missing `promoted_ticket_id` column (and
        5 other tables) on `compliance.email_intelligence_items`, the exact
        table this route queries. Performed the requested live
        re-verification directly against the live DB (not narrated):
        connected via the repo's own `postgres` client + `.env.local`
        `DATABASE_URL`, confirmed `promoted_ticket_id` now exists on
        `compliance.email_intelligence_items`, and ran the exact
        column-set `listEmailIntelligenceItems()` selects
        (`db.query.emailIntelligenceItems.findMany`, all 14 schema
        columns) for a nonexistent/fresh `org_id` -- query succeeded (0
        rows, no error), where it previously would have thrown a `42703`
        undefined-column error. Root cause is now known: this was the
        *same* bug as MIGRATION-DRIFT-0264-EMAIL-INTEL-500-FIX (a missing
        column from a migration recorded-but-never-applied on prod), not a
        genuinely distinct email-intelligence-specific issue. No separate
        fix needed. The route's lack of a `requireErpEnabled()`-style
        module gate (403-vs-500 semantics) is still real and unaddressed --
        if email intelligence is ever meant to be an entitled/gated module,
        that gate would still need adding -- but it is no longer the cause
        of a live 500 and is downgraded to a genuine low-priority polish
        item, not an active bug.
      size: deferred_small
      recommendation: |
        No longer urgent as a bug (the live 500 is fixed). If email
        intelligence is later decided to be an entitled/gated module,
        add the same "module not enabled" -> 403 gate the CRM/ERP routes
