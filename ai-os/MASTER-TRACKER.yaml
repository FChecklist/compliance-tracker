        missing column threw a real, uncaught-by-design Postgres error
        (correctly caught by the route's own try/catch as an honest 500 --
        the route-level error handling was never the bug here). Real fix:
        re-applied the entire migration file directly against production
        (every statement in it is idempotent -- `CREATE TABLE IF NOT EXISTS`,
        `ADD COLUMN IF NOT EXISTS`, `DO $$ ... EXCEPTION WHEN
