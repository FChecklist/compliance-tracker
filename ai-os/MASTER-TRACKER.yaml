        stated domain list (finance & accounting, operations & inventory, compliance & legal) so they
        agree on what VERI Chat is actually scoped to. Add a real regression test: send a benign,
        in-scope question from each named domain (at minimum accounting/finance, given this is the one
        caught live) to a fresh test org and assert the reply is not a refusal.
      status: "closed 2026-08-30 (R1-R64 recheck, found ALREADY fixed by an earlier round --
        R63 gap-closure, 2026-08-29, per its own comment in purpose-bound-ai.ts) -- discovered
