        buildMultiDomainPurposeClause(await resolveOrgDomains(orgId)) instead -- names every
        domain this specific org actually has enabled (compliance always + erp/sales/pms per
        real enablement checks), reconciling the PURPOSE_CLAUSE with the persona paragraph's own
        stated domain list. Confirmed by reading both real call sites directly, not just the
