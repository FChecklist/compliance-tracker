      status: resolved
      first_raised: "OCID-020 continuation sweep, 2026-08-02/03 (UMR-20260802-223152-0b6a)"
      resolved: "2026-08-03 (live-reverified via direct DB query; same root cause as MIGRATION-DRIFT-0264-EMAIL-INTEL-500-FIX, UMR-20260803-012711-18b4)"

    - id: GAP-ERP-REPORTS-CLIENT-CRASH-ON-403
      name: "/erp/reports crashes to a blank white page for a module-not-enabled org, instead of degrading gracefully like every other 403'd page (severity: high -- full page-blocking crash, not a background/widget failure)"
      old_ids: []
      detail: |
        Real, reproducible finding from the OCID-020 real nav-surface sweep
        (`UMR-20260803-081331-af0b`, completing under
        `ai-os/PROJEXA_AI_COM_E2E_CERTIFICATION_NAV_SWEEP_COMPLETE_2026-08-03.md`).
        For a fresh, module-not-enabled org, every backing API this page calls
        correctly returns `403` (`/api/erp/reports/trial-balance`,
        `/api/erp/reports/balance-sheet`, `/api/erp/reports/profit-and-loss`,
        `/api/erp/reports/cash-flow`, `/api/erp/companies`) -- the same 403
        pattern every other gated page on this site handles gracefully
        (renders, shows an empty/disabled state). But this page's own frontend
        does not handle the 403 responses: it throws `TypeError: Cannot read
        properties of undefined (reading 'length')`
        (`_next/static/chunks/2gvfnp30pbu-i.js:1:8727`), which Next.js's error
        boundary catches only as a full-page replacement -- "Application
        error: a client-side exception has occurred", a completely blank page.
        Real screenshot:
        `/opt/veridian/browser/screenshots/ocid020-continue/nav-v3-_erp_reports.png`.
        Root cause not yet investigated at the component-code level -- the
        stack trace points at a minified chunk, not source; whoever fixes this
        should first identify which report-summary component reads `.length`
        on a value it assumes is always an array/response object, and add the
        same defensive handling (or `requireErpEnabled()`-gated empty state)
        the rest of the ERP surface already has.
      size: S
      recommendation: |
        Add a null/undefined guard (or an explicit "module not enabled" empty
        state, matching every sibling ERP page) wherever `/erp/reports`'s
        frontend reads `.length` on the failed-403 response. Add a real
        regression test (fresh org, module not enabled, load `/erp/reports`,
        assert no client-side exception) so this can't silently regress.
      status: resolved
      fix_detail: |
        Root cause confirmed at the component level (this task's PM decision,
        UMR-20260803-094100): `src/app/(app)/erp/reports/page.tsx`'s Trial
        Balance tab footer guard read `tb && tb.accounts.length > 0`. `tb` is
        set directly from `trial-balance`'s parsed JSON body; for a 403 it is
        the error body `{ error: "..." }` -- truthy, but with no `accounts`
        field, so `tb.accounts.length` threw exactly the evidenced
        `TypeError: Cannot read properties of undefined (reading 'length')`.
        This is the default-active tab (`Tabs defaultValue="tb"`), so the
        crash fires on first render, matching the sweep's fully-blank-page
        screenshot. The Cash Flow tab's superficially-similar
        `cf?.operating.xxx` chains were checked and are NOT a bug: `?.`
        short-circuits the whole remaining chain, not just the first hop, so
        `.operating` is only read once `cf` is confirmed non-null.

        Fix: extracted `hasTrialBalanceFooterRows()` to
        `src/lib/erp-reports-guards.ts` (guards `report.accounts` existence,
        not just `report`, before reading `.length`), used in place of the
        inline guard in `page.tsx`. Added
        `src/lib/erp-reports-guards.test.ts` (bun:test, matching this repo's
        pure-logic-extraction test convention since there's no
        component-render harness here) -- verified the new test reproduces
        the identical `TypeError` when run against the pre-fix logic, and
        passes against the fix. `bun test` (4/4 pass), `bunx tsc --noEmit`
        clean, `bunx eslint` clean on both changed files.

        Merged as PR #803 (real merge commit `e6e5a156b331ca817f33c3ad561ab755a6b7cd77`,
        independently confirmed ancestor of `origin/main` via `git merge-base --is-ancestor`,
        per PM decision `UMR-20260803-162547-b968`). PR #803's own branch had diverged before
        PR #795's separate, independently-merged Cash Flow tab `?.` fix landed -- rebased
        (squash-cherry-pick, not a raw multi-commit replay, to avoid re-playing a known-broken
        intermediate `PROGRESS.md`-truncation commit already fixed within PR #803's own
        history) onto current `main`; confirmed the real Trial Balance guard change
        (`hasTrialBalanceFooterRows()`) does not touch or regress the already-merged Cash Flow
        fix (verified via diff: PR #803's own commit only ever touched the Trial Balance
        footer-guard line, never the Cash Flow lines). Full local verification re-run after
        the rebase, not assumed still valid: `bun test` (2479/2479 pass), `bunx tsc --noEmit`
        (clean), `bunx eslint` (clean).

        **Independently re-tested live against `projexa-ai.com` after the merge, real evidence,
        not narrated**: provisioned a fresh, isolated, module-not-enabled test org (Supabase
        Admin API), confirmed the real backing API still genuinely 403s
        (`GET /api/erp/reports/trial-balance` -> `403`, the same real trigger condition as the
        original finding), then loaded `/erp/reports` in a real headless browser with the
        session cookie injected (using the real, verified no-sudo Playwright fix from OCID-048's
        execution, `LD_LIBRARY_PATH=/home/rajat/.local/chrome-system-libs`) -- the page renders
        its real "Financial Reports" UI shell (Trial Balance/P&L/Balance Sheet tabs, nav
        sidebar, onboarding checklist), with **no** "Application error: a client-side exception
        has occurred" blank-page crash. Real screenshot captured:
        `/opt/veridian/browser/screenshots/finding1-retest-post-pr803.png` (host-local, not
        committed -- same convention as the original finding's own screenshot reference).
      first_raised_by_fix: "UMR-20260803-094100, merged as PR #803"
      first_raised: "OCID-020 real nav-surface sweep, 2026-08-03 (UMR-20260803-081331-af0b)"
      resolved: "2026-08-03: PR #803 merged (`e6e5a156b331ca817f33c3ad561ab755a6b7cd77`),
        independently confirmed ancestor of `origin/main`. Independently re-tested live
        post-merge with a real browser and a real screenshot (not narrated) confirming the
        page no longer crashes on the original 403 trigger path. Per PM decision
        `UMR-20260803-162547-b968`."

    - id: GAP-PRODUCT-BRANCHES-LIVE-VS-DIRECT-READ-DISCREPANCY
      name: "Real, recurring pattern (2 independent occurrences, 2 different schemas/tables): direct DB reads (psql, PostgREST) disagree with confirmed-live app behavior -- ROOT CAUSE FOUND AND CONFIRMED, 2026-08-04: a real hand-authored migration moved both tables to a separate `platform` Postgres schema; every direct read this session (including this gap's own two occurrences) queried the wrong (default/compliance) schema"
      old_ids: []
      detail: |
        Found during OCID-050's State C (large-data org) preparation, 2026-08-03.
        `src/lib/services/product-branch-service.ts`'s `getBranchId()` throws
        `ServiceError("Product branch '<key>' is not registered", 500)` if no row
        with that `branch_key` exists. `isErpEnabledForOrg()` ->
        `isBranchEnabledForOrg(orgId, 'erp')` -> `getBranchId(db, 'erp')` has no
        surrounding try/catch anywhere in the call chain (`/api/me/route.ts` calls
        it unguarded). Given this, if `product_branches` genuinely has no 'erp' row,
        a live call MUST 500.

        Independently confirmed, twice, via two different protocols against the
        same project (`pcrjmlpuqsbocqfwoxod.supabase.co`, verified to be the real
        live project because a real Auth login + hand-built session cookie against
        it correctly authenticated as a real live user and returned correct real
        org data from `/api/me`): `psql "$DATABASE_URL" -c "select * from
        compliance.product_branches"` and a PostgREST call with
        `SUPABASE_SERVICE_ROLE_KEY` (`Prefer: count=exact` -> `content-range:
        0-0/1`) both show **exactly 1 row**, `branch_key='grc'`.

        Yet a real, live, authenticated `GET /api/erp/journal-entries` against
        `demo_co_1_sharma` (a real org, real user, real session) returns a clean
        `403` with the exact polished message `requireErpEnabled()` throws
        ("This capability is not part of the Module your organization purchased...")
        -- which only happens if `getBranchId(db,'erp')` resolved successfully
        (found a real 'erp' branch row) and then evaluated the org's own
        enablement row as `false`. A genuinely-missing branch would 500, not 403.
        This is a hard, direct, reproducible contradiction between two
        independently-verified direct reads and one independently-verified live
        behavior. Root cause not found this pass -- candidates considered but not
        confirmed: a schema/search_path difference between what Drizzle's
        relational query builder resolves at request time vs. what `psql`/PostgREST
        resolve by default; a second, shadow `product_branches`-shaped table/view;
        or an env-var difference between this session's `.env.local` and Vercel's
        own configured environment that isn't visible from the Auth-endpoint check
        alone. Not chased further this pass -- out of scope for OCID-050, and
        risking a write against the wrong store outweighed the value of resolving
        it here.
      size: M
      recommendation: |
        Whoever picks this up: start by having a live Vercel serverless function
        instance itself log `db.query.productBranches.findMany()`'s real result
        (a temporary diagnostic route or a Sentry breadcrumb), rather than trying
        another external read -- the two external reads already available (direct
        psql, PostgREST+service-role) both agree with each other and disagree with
        live behavior, so a third external read is unlikely to add signal.

        **Amendment (2026-08-03, OCID-049 real testing, `UMR-20260803-203925-1a38`): a second,
        independent occurrence found, different schema/table.** While testing OCID-049's
        AI-package routing mechanism, two real, confirmed-successful `end_user_org`-scope AI
        resolutions were triggered live (real VERI Chat messages, real on-topic LLM replies
        returned). Per `src/lib/ai-router/mother-router.ts`'s own code, every such resolution
        writes a row to `platform.ai_routing_audit_log` via `logRoutingDecision()`. PostgREST does
        not expose the `platform` schema at all (`Accept-Profile: platform` -> `PGRST106`, "Only
        the following schemas are exposed: public, graphql_public, compliance"); no API route or
        UI page in the codebase reads this table either (confirmed via `git grep` -- write-only
        from the app's own perspective). The remaining channel, a direct read-only `psql` query
        against `DATABASE_URL`, returned **zero rows total** for the entire table -- not just zero
        recent rows -- despite this session's own confirmed-real `end_user_org` triggers and near-
        certain `software_team`-scope activity from this same long session's own extensive
        worker/supervisor AI dispatch history. Same symptom class as the `product_branches`
        finding above (a live mechanism confirmed working by its own observable effects, whose
        backing data is invisible via every currently-available external read channel), now
        confirmed in a second, structurally unrelated schema (`platform` vs `compliance`) and
        table. This rules out "product_branches specifically has some narrow sync issue" as an
        explanation -- whatever the real root cause is, it is not isolated to one table.

        **ROOT CAUSE FOUND AND CONFIRMED (2026-08-04, PM decision `UMR-20260804-030715-b004`,
        real DB evidence, not narration).** `src/lib/db/schema.ts` defines both `productBranches`
        (line 2100) and `aiRoutingAuditLog` (line 11389) via `platformSchemaDB.table(...)`, where
        `platformSchemaDB = pgSchema('platform')` -- the real, live table for both is in the
        `platform` Postgres schema, not `compliance`. This is not a Drizzle-only abstraction: a
        real, hand-authored SQL migration, `drizzle/0245_create_platform_schema_compartment.sql`
        (Owner directive, 2026-07-19, "Supabase free tier limits us to 2 projects/databases
        total... a new Postgres schema WITHIN this same database"), literally moved 22 tables --
        including `product_branches` and `ai_routing_audit_log` -- from `compliance` to a newly
        created `platform` schema via `ALTER TABLE compliance.product_branches SET SCHEMA
        platform;` (and the sibling statement for `ai_routing_audit_log`). Every direct read this
        gap's own two occurrences relied on (`psql "$DATABASE_URL" -c "select * from
        compliance.product_branches"`, and the later `ai_routing_audit_log` psql check) queried
        the pre-migration schema location -- a real, reproducible methodology error, not a live-app
        bug or an unexplained infrastructure mystery.

        Live-reconfirmed just now (2026-08-04), schema-qualified correctly this time:
        `SELECT table_schema, table_name FROM information_schema.tables WHERE table_name IN
        ('product_branches','ai_routing_audit_log')` shows `product_branches` exists in BOTH
        `compliance` (1 row, `branch_key='grc'` -- see the new, separate finding below) AND
        `platform` (27 rows, including `erp` id `2993b212-bd9a-4d0a-b25c-603ba1e236b0` and
        `projexa` id `5fceebcd-0a7a-4448-ae2b-a72637124f13` -- the exact id a real Wave-9
        PROJEXA org's `primaryProductBranchId` points to, independently confirming
        `ai-os/VERIDIAN_OCID_038_UNIFIED_PLATFORM_INTEGRATION_DISCOVERY_2026-08-03.md` section
        9.1's "no PROJEXA branch exists" sub-finding was ALSO this same wrong-schema mistake, not a
        real orphaned-FK data-integrity gap -- corrected separately in that document); `ai_routing_audit_log`
        exists ONLY in `platform` (never had a `compliance` copy) and genuinely has 3 real rows
        matching known real `end_user_org` AI-resolution activity from this session's own earlier
        OCID-049 testing (`created_at` timestamps `2026-08-03 21:1x`, exactly matching that testing
        window). **This fully explains both occurrences: the live app was always correct; every
        direct-read verification this session performed against these two tables queried the wrong
        schema.** No code fix is needed -- `getBranchId()`, `isBranchEnabledForOrg()`,
        `logRoutingDecision()`, and every other real call site already correctly resolve
        `platform.product_branches`/`platform.ai_routing_audit_log` via Drizzle's own schema
        mapping; they were never broken.

        **New, separate, minor finding this pass (not a live-app bug, real but low-priority
        technical debt):** `compliance.product_branches` still exists as a genuinely separate,
        orphaned table (1 row, `branch_key='grc'`) -- `ALTER TABLE ... SET SCHEMA` moves a table
        rather than copying it, so this stray row was created AFTER the 2026-07-19 migration ran,
        by some later process not yet identified (not chased further this pass -- a live, if
        unused, data-integrity cleanup question, not blocking). Confirmed via `grep` that no `src/`
        code references `compliance.product_branches` specifically (every real call site uses the
        Drizzle `productBranches` symbol, which always resolves to `platform.product_branches`) --
        this table appears to be dead weight, not a live shadow-read path, but deleting live
        production data was not done unilaterally in this pass; flagged for whoever next does DB
        hygiene work to confirm and clean up.
      status: resolved
      first_raised: "OCID-050 State C preparation, 2026-08-03 (UMR-20260803-185714-89c6)"

