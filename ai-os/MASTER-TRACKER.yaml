        `fetchMeWithSessionRetry()`: a small, targeted retry-with-backoff wrapper (up to 3 attempts,
        only accepting a response with a real `d.id`). Real tests: `src/app/(app)/settings/page.test.ts`
        (new), 3/3 pass, against the extracted pure retry helper with a mocked `fetch`. `tsc --noEmit`
        clean, `eslint` clean, full suite 2512/2512 pass, terminology guardrail clean.

        **Honest limitation, not a full fix, disclosed by the real independent reviewer's own
        `AUDIT: PASS` comment on PR #930**: this is a client-side retry mitigation, not a fix to the
        actual server-side session-resolution race in `/api/me`. The root cause (a concurrent
        Supabase session-refresh returning a premature null-field `200`) still exists and could
        resurface in any other component that calls `/api/me` directly without this same retry
        wrapper. Worth a real follow-up gap to harden `/api/me` itself (e.g. never return `200` with
        an all-null body while a session refresh is in flight) rather than requiring every caller to
        replicate this client-side pattern -- not chased further here, out of this gap's own narrow
        scope.

