    - id: GAP-NAV-TIMEOUT-ORCHESTRA-PROMPTEVAL-SALESHQ
      name: "/orchestra, /prompt-eval, /sales-hq each timed out during the real nav-surface sweep -- RESOLVED, confirmed a test-methodology artifact, not a real product defect"
      old_ids: []
      detail: |
        Real finding from the OCID-020 nav-surface sweep, originally recorded
        with explicit honesty about an unresolved confound: host load rose
        to `10-13` (1-minute load average, 8-core box) partway through that
        run, plausibly caused by concurrently-dispatched worker tasks. All 3
        timeouts were real `page.goto` `networkidle` 20s timeouts, not a
        browser crash and not a 4xx/5xx.
      resolution_note: |
        **RESOLVED, real isolated re-test performed 2026-08-03
        (`UMR-20260803-101058-1d10`).** Re-tested each of the 3 routes one
        at a time (not a batch), fresh browser instance per route, real
        login as the same test org. First re-test (30s `networkidle`
        timeout, host load still real and elevated at ~9.8-9.9 at the time
        -- honestly noted, not a fully load-controlled re-test) reproduced
        the identical timeout on all 3, which raised rather than lowered
        suspicion of a real product defect. A second, targeted follow-up
        re-test switched `waitUntil` from `networkidle` to `load` (15s
        timeout) -- **all 3 resolved instantly (~1 second each), real `200`
        status, correct final URL matching the target route, real page
        title and body content confirmed present.** This is conclusive:
        `page.goto`'s `networkidle` condition (0 network connections for
        500ms) never firing on these 3 pages, while `load` (DOM ready + load
        event) fires immediately, means something on these specific pages
        keeps at least one network connection open indefinitely (a
        websocket, long-poll, or SSE connection -- plausibly VERI Chat's
        live-update mechanism, present in the screenshot's right-hand panel
        on all 3 pages, showing a loading spinner) -- a normal, benign
        pattern for a live-updating UI panel, not a hung/broken page. This
        is a real, definitive test-methodology finding (Playwright's
        `networkidle` is documented as unsuitable for pages with persistent
        connections), not a real product defect. No code fix needed or
        appropriate.
      size: XS (a single, isolated re-test of exactly 3 routes -- completed)
      recommendation: |
        For any future nav-surface sweep of this site (or any Next.js app
        with a persistent VERI-Chat-style side panel), prefer
        `waitUntil: 'load'` or `'domcontentloaded'` over `'networkidle'` to
        avoid false-timeout findings on pages with legitimate persistent
        connections -- `networkidle` should be reserved for pages
        specifically expected to go fully idle.
      status: resolved
      first_raised: "OCID-020 real nav-surface sweep, 2026-08-03 (UMR-20260803-081331-af0b)"
      resolved: "2026-08-03 (isolated re-test, UMR-20260803-101058-1d10 -- confirmed test-methodology artifact, not a product defect)"

    - id: GAP-SUPERVISOR-RETRIGGER-STALE-WORKSPACE
      name: "veridian-task.py adopt + the archive-review.json/restart retrigger pattern reviews a stale, frozen workspace snapshot instead of the branch's current remote tip (severity: medium -- wastes real review cycles, does not itself cause a bad merge since a stale review can only be more conservative, never less, but is a real correctness/efficiency gap)"
      old_ids: []
      detail: |
        Real, directly observed and root-caused (not assumed) while resolving
        claude-control PR #123 (UMR-20260803-025317-0c64's Category B
        implementation). `veridian-task.py adopt` checks out the task's
        workspace to a DETACHED HEAD at whatever the branch's tip was at
        adoption time (confirmed via `git symbolic-ref -q HEAD` returning
        non-zero in the workspace). `scripts/supervisor-entrypoint.sh` runs
        `cd "$WORKSPACE" && git fetch origin` then computes the review diff as
        `git diff "origin/$DEFAULT_BRANCH"...HEAD` -- `git fetch` refreshes
        the REMOTE-TRACKING ref, but nothing re-checks-out the workspace's own
        detached HEAD to match the branch's new tip. So pushing additional
        commits to an already-adopted branch, then retriggering review via the
        established "archive `$TASK_DIR/review.json`, `systemctl --user
        restart veridian-supervisor@<task_id>"` pattern (used repeatedly this
        session for exactly this purpose), reviews the SAME frozen diff every
        time, not the real current one.
        Directly confirmed for PR #123: 4 consecutive `AUDIT: FAIL` rounds
        each reported an identical `git diff --stat` line ("3 files changed,
        802 insertions(+), 17 deletions(-)") in their `Scope Confirmed` field,
        despite 4 real fix commits having been pushed in between. Verified
        directly: the task workspace's `git log -1` matched the SECOND commit
        (the adoption-time HEAD), not the real branch tip, across all 4
        rounds -- confirmed via `git fetch origin <branch>` +
        `git log origin/<branch> -1` showing a different, later SHA each
        time. Fixed for this specific task by manually running
        `git fetch origin <branch> && git checkout origin/<branch>` inside
        the workspace directory immediately before the 5th (successful)
        retrigger.
        Real, honest scope limitation on this finding: every "fix" pushed in
        response to rounds 1-3's feedback was independently confirmed correct
        via this session's own passing test suite before being pushed, so no
        actually-broken code was ever incorrectly approved by this gap --  the
        real cost was 3 wasted real review cycles (each a real, metered
        Superboss review run) reviewing content that no longer reflected the
        real branch state, and real time spent by this session investigating
        review feedback that had already been addressed. Whether this same
        staleness affected any EARLIER task in this session that used the
        adopt-then-push-more-commits-then-retrigger pattern was not
        separately audited here -- that would require checking each such
        task's workspace HEAD against its branch's real commit history at the
        time of each retrigger, which is out of scope for this entry.
      size: "S-M -- the real fix is either (a) have the retrigger path itself
        run `git fetch && git checkout origin/<branch>` in the workspace
