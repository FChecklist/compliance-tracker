        (from the real `src/app/manifest.ts` Next.js metadata route) returns
        HTTP 200 with a real `share_target` wired to
        `/api/veri-chat/share-target`, and a real `<link rel="manifest">` tag
        is present in the live page `<head>` -- the app really is
        installable. Separately, real test: `browserContext.setOffline(true)`
        + reload renders a fully blank white page (real screenshot) -- no
        offline fallback shell, no cached content, no "you're offline"
        messaging, confirming no service worker backs the real manifest.
        Real recovery confirmed clean: restoring network + reload returns to
        `/home`, authenticated session intact, no forced re-login.
      size: "M -- adding a real service worker (even a minimal app-shell
        cache, e.g. via `next-pwa`/`serwist`/a hand-written `sw.js` +
        registration) is a genuinely new subsystem, not a one-line fix.
        Real scope decision needed on how much offline capability is
        actually wanted (full offline-first vs. a graceful \"you're
        offline\" shell) before sizing further."
      recommendation: |
        When picked up (post OCID-020 unlock): decide the real target
        offline experience first (this repo's own PLATFORM_STRATEGY.md PWA
        section, if any, should be checked/updated), then add a real service
        worker + registration, then re-run this same real offline test to
        confirm a graceful fallback instead of a blank page.
      status: open
      first_raised: "OCID-038/039/040 real end-user testing, 2026-08-03 (UMR-20260803-072940-6a88)"
      implementation_note: |
        2026-08-04, real implementation authorized (UMR-20260804-105822-a267): a real minimal
        app-shell service worker (`public/sw.js`) + a real, plain static offline fallback page
        (`public/offline.html`) added -- network-first for navigation requests only, falls back to
        the cached offline page on a genuine network failure; every other request (API calls,
        data fetches, static assets) passes straight through, untouched, since this app is
        almost entirely dynamic/authenticated and caching API responses would risk stale/wrong
        data. Deliberately NOT a full offline-first cache -- matches the real, narrow scope this
        gap's own recommendation asked for. Registered inside `AppShell.tsx` (the authenticated
        app shell, the exact real mount point the original gap was observed inside). Real, local
        verification done: `bunx tsc --noEmit` clean, `bunx eslint` clean, `node --check
        public/sw.js` confirms valid JS syntax, real unconstrained `bun run build` clean.
        `status` deliberately left `open`, not flipped to `resolved`: this gap's own
        recommendation explicitly requires "re-run this same real offline test to confirm a
        graceful fallback instead of a blank page" against a real live session -- that live
        re-test requires this fix to actually be deployed first (Vercel auto-deploys on merge to
        `main`), so it is a genuine post-merge step, not something that can be honestly claimed
        before the PR merges. Real PR opened, independent review pending, no self-certification.

