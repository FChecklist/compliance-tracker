    - id: GAP-VERI-CHAT-NO-VISIBLE-DETERMINISTIC-VS-AI-SIGNAL
      name: "End users have no visible way whatsoever to tell a deterministic-routed VERI Chat reply apart from a genuine AI-escalated one on the real, live, primary rendering surface (/home) -- stronger than merely 'unintentional,' the one component with confidence-badge logic is structurally unreachable for the AI thread"
      old_ids: []
      detail: |
        Real, live finding, `UMR-20260802-165606-4413` (OCID-020), `UMR-20260803-115620-29c6` (OCID-052),
        executing OCID-052's own Item 4 (`ai-os/VERIDIAN_OCID_052_VERI_CHAT_AI_ESCALATION_CERTIFICATION_PLANNING_2026-08-03.md`),
        per PM decision `UMR-20260803-201840-af59`.

        The planning doc's own discovery (§"Real, honest gap found") had already read
        `src/components/chat/ThreadView.tsx` and found a confidence badge
        ("High/Medium/Low confidence") rendered only when `message.confidenceLabel` is set -- present
        for genuine LLM replies, `null` for deterministic/scripted/refused ones -- and flagged this as a
        real but *unintentional* distinguishing signal, pending live confirmation.

        Live execution found the real signal is **weaker than that prediction, not stronger**: a fresh
        test org's real AI thread was sent both a deterministic-trigger message ("what's the status" --
        real reply "No tasks yet", persisted `confidence_label: null`, zero LLM call) and a genuine
        AI-escalating message ("Can you create a task for renewing our fire safety certificate next
        month?" -- real reply "Sure thing, Boss. Just need two quick details...", persisted
        `confidence_label: "high"`, real LLM call confirmed via ~6s round-trip). Both were then rendered
        live on `/home` (real screenshot,
        `/opt/veridian/browser/screenshots/ocid052-item4-home-thread.png`) -- VERI Chat's real primary
        surface per `HomeThreadSlot.tsx`'s own header comment ("on Home, VERI Chat isn't a side panel,
        it's the center of the page").

        Root cause, confirmed by direct code read: `/home` renders the AI thread via `HomeThreadSlot.tsx`
        -> `ThreadView` from the **external** `@fchecklist/veridian-ui-kit/panel` package -- a
        *different* component from the one the planning doc analyzed. `HomeThreadSlot.tsx`'s own
        `RawMessage`-to-`ThreadMessage` mapping (line 31) extracts only `id`/`senderId`/`content`/
        `createdAt` -- `confidenceLabel` is never read from the API response and never passed through.
        The confidence-badge-capable component (`src/components/chat/ThreadView.tsx`) is real and does
        exist, but a full-codebase check of its own two live import sites
        (`grep -rn 'from "@/components/chat/ThreadView"'`) found it wired only to
        `src/app/(app)/tickets/[id]/...` (an unrelated support-ticket thread) and
        `src/app/(app)/chat/page.tsx` -- and that page's own conversation list explicitly filters
        `!c.isAiThread` (line 67), so the AI thread can **never** render through it. The badge logic is
        real, live code, but genuinely unreachable for the one thread type this OCID cares about.

        Live, visual confirmation (real screenshot): both the deterministic reply and the AI-escalated
        reply render as plain white message bubbles with the same orange "V" assistant avatar, same
        typography, zero badge, zero label, zero visual distinction of any kind. Page-body text search
        for "confidence" on the live-rendered `/home` page: zero matches, despite the AI-escalated
        message's real, persisted `confidence_label: "high"`.
      size: "S -- HomeThreadSlot.tsx's RawMessage type + mapping needs confidenceLabel added and passed
        through to whatever real distinguishing UI is designed; the underlying badge-rendering logic in
        the other ThreadView component could potentially be ported/reused, but a real product decision
        on what the end-user-facing label/indicator should actually say is needed first (this finding
        is discovery, not a prescribed fix)."
      recommendation: |
        This is a genuine, real UX gap, not a testing artifact: today, an end user watching VERI Chat's
        real primary conversation surface has no way to know whether a reply came from a fast,
        deterministic, zero-LLM-cost lookup or a genuine AI generation -- a real transparency/trust gap
        for a product whose own architecture deliberately built a deterministic-first routing layer
        (`GAP-VERI-CHAT-PURPOSE-CLAUSE-SCOPE-CONTRADICTION`'s and this OCID's own Items 2-3 confirmed
        that routing genuinely works correctly end to end) -- the routing exists but is invisible.
        Recommend: (a) add `confidenceLabel` (or a purpose-built `sourceType: 'deterministic' | 'ai' |
        'scripted'` field, cleaner than overloading the confidence heuristic per
        `GAP-VERI-CHAT-CONFIDENCE-LABEL-NO-REFUSAL-DETECTION`) to `HomeThreadSlot.tsx`'s message mapping
        and render a real, explicit, intentional indicator (not reuse the confidence badge, which this
        session separately found unreliable for refusal detection); (b) decide whether the same
        indicator should also appear in any other real AI-thread rendering surface found later.
      status: resolved
      first_raised: "This session, 2026-08-03, real live test during OCID-052 Item 4 execution (UMR-20260803-201840-af59, UMR-20260802-165606-4413 OCID-020)"
      resolved: |
        2026-08-03, OCID-021 Wave 1 (real implementation, `UMR-20260802-173631-ca85`, authorized by PM
        decision `UMR-20260803-212402-1922` after OCID-020 was declared complete), per this gap's own
        `recommendation` above. Added `confidenceLabel` to `HomeThreadSlot.tsx`'s `RawMessage` type
        (matching the shape `getMessages()` in `chat-service.ts` already returns, per that function's
        own `confidenceLabel: m.confidenceLabel as "high" | "medium" | "low" | null` mapping -- the
        backend was already emitting this field, `HomeThreadSlot.tsx` was simply never reading it) and
        a new exported pure function, `withSourceTypeLabel()`, that prepends a real, explicit
        `"✨ AI-generated reply"` marker line to a message's `content` when `senderId === null` (an
        assistant message, never the org's own user) and `confidenceLabel !== null` (a real LLM call
        produced this reply, per `deriveConfidenceLabel()`'s own contract of never being called for a
        deterministic/scripted/gated reply) -- deliberately using presence/absence only, not the
        high/medium/low value itself, so this does not inherit
        `GAP-VERI-CHAT-CONFIDENCE-LABEL-NO-REFUSAL-DETECTION`'s separate tier-accuracy issue. Content is
        overloaded rather than a new UI slot because the real, external `@fchecklist/veridian-ui-kit/panel`
        `ThreadView` component `/home` renders through has no per-message metadata slot to render a
        badge into, and extending it would require a cross-repo package release for one surface.

        Verification performed: `bunx tsc --noEmit` clean (full repo). New regression test file
        `HomeThreadSlot.test.ts` (4 tests, 6 assertions, all pass) covers the pure `withSourceTypeLabel()`
        function directly -- matching this repo's established pattern of testing the pure derivation
        function a component delegates to (see `ChainSelector.test.ts`) rather than rendering the
        component itself, since `ThreadView` is an external package component not under test here.

        **Real, honest limitation, not glossed over:** this pass verified the derivation logic
        (`withSourceTypeLabel()`) directly via unit tests, not a full live browser re-render of `/home`
        with a real deterministic + real AI-escalated message pair (the exact live repro this gap's own
        `detail` section used to originally find the bug) -- that live re-confirmation is a tracked
        follow-up for once this PR merges and deploys, same discipline already established by
        `GAP-ERP-SALES-CONSTRUCTION-PMS-NO-SELF-SERVICE-ENABLEMENT-API`'s own fix for the same class of
        "route/UI change requires a real deploy before live re-verification is possible."

    - id: GAP-STAGE0-ROLE-MISSING-FROM-ROLE-RANK
      name: "stage_0 is a real DB role (userRoleEnum) but is missing from the UserRole type and ROLE_RANK map, so a stage_0 user fails every requireRole()/requirePermissionForUser() gate in the app -- including the lowest-bar (viewer/member) ones"
      old_ids: []
      detail: |
        Real, live finding, `UMR-20260802-165606-4413` (OCID-020), confirmed during OCID-047's real
        API-level role/rights test execution (`UMR-20260803-145921-c0c4`) -- 11 real, isolated test
        users (one per real DB role) each called 5 real API routes spanning the rank spectrum. All
        55/55 real outcomes matched `ROLE_RANK`'s prediction for 10 of the 11 roles. The 11th,
        `stage_0`, failed all 5 -- including `erp.fixed_assets.create` (minimum real rank: `member`,
        rank 2), the single lowest-bar action tested.

        Root cause, confirmed directly in code, not assumed: `src/lib/supabase/auth-guard.ts:28-38`.
        `userRoleEnum` (schema.ts) has 11 real values including `stage_0`, but the `UserRole` TypeScript
        type (`:28-29`) and the `ROLE_RANK` map (`:31-38`) both list only 10 -- `stage_0` is absent from
        both. `hasRole()`'s rank lookup (`ROLE_RANK[dbUser.role as UserRole] ?? 0`) therefore silently
        falls back to rank 0 for any `stage_0` user, below every real minimum rank (the floor is
        `viewer`/`client_viewer`/`external_auditor` at rank 1) -- functionally locking that role out of
        every `requireRole`/`requirePermissionForUser`-gated action in the entire app.

        This is the exact same bug class the file's own code comment (`auth-guard.ts:22-27`) documents
