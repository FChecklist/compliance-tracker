migration_tracking_table_fix:
  problem: >
    drizzle.__drizzle_migrations had 0 rows. Even after fixing the schema gap
    above, drizzle-kit migrate's own bookkeeping was still broken:
    drizzle/meta/_journal.json (the file readMigrationFiles() actually reads)
    only ever listed migration 0000, so drizzle-kit migrate had never known
    migrations 0001-0263 existed, and a future `bun run db:generate` would
    have computed its next index as 1 (colliding with the real, existing
    0001_mcp_access_codes.sql filename) and diffed against 0000's badly-stale
    snapshot -- producing a bogus "recreate the entire schema from scratch"
    migration, exactly as 0251's own comment already predicted.
  fix_applied:
    - "Rebuilt drizzle/meta/_journal.json with a dense, sequential idx (0-260) for all 261 real migration files, in numeric-tag order. Each entry's tag is the exact real filename stem; 'when' timestamps were derived from each file's real first-commit-to-repo time via `git log --diff-filter=A --format=%at`, converted to milliseconds and nudged to be strictly increasing where multiple files landed in the same commit second (verified: all 261 entries strictly increasing)."
    - "Populated drizzle.__drizzle_migrations with one real row per migration: hash = sha256(raw file content) exactly matching drizzle-orm's readMigrationFiles() hashing, created_at = that migration's journal 'when' value. 261 rows inserted (confirmed via SELECT COUNT(*): 261, MAX(created_at) matches the last journal entry's 'when')."
  why_this_is_correct: >
    Read drizzle-orm@0.45.2's actual PgDialect.migrate() source (pg-core/
    dialect.cjs) rather than guessing the row format: it selects the SINGLE
    row with the max created_at from __drizzle_migrations, then for each
    journal entry in order, replays it ONLY if that entry's folderMillis is
    greater than the max created_at already recorded. With 261 real rows now
    present (max created_at = migration 0263's timestamp, which is also the
    journal's last entry), every real journal entry's folderMillis is <= that
    max -- so a future `bun run db:migrate` will correctly recognize all 261
    migrations as already applied and do nothing, rather than either
    replaying migration 0000 again (today's original failure) or replaying
    nothing because the journal didn't know the other 260 files existed.
  verification: >
    SELECT COUNT(*) FROM drizzle.__drizzle_migrations returns 261 (was 0).
    MAX(created_at) = 1785039502000, matching drizzle/meta/_journal.json's
    final entry (0263_prompt_lifecycle_governance_gates) exactly.
  known_limitation_not_fixed_this_pass: >
    drizzle/meta/ is still missing per-migration snapshot JSON files for
    migrations 0001-0263 (only 0000_snapshot.json + the repaired
    _journal.json exist) -- these are used ONLY by `drizzle-kit generate`
    (not `migrate`) to diff schema.ts against the last-known schema state
    when authoring a NEW migration. Journal + tracking-table repair alone
    makes `db:migrate` safe (this task's actual success criterion); it does
    NOT make `db:generate` produce a correct diff for the next new migration
    -- that would still diff against 0000's snapshot (pre-dating 260
    migrations of real schema evolution) and produce a bogus "recreate
    everything" file. Regenerating an accurate current-state snapshot would
    require a working bun/node_modules environment to run `drizzle-kit
    generate` once for real and capture (not apply) its resulting snapshot --
    unavailable in this task's sandbox (no bun, no drizzle-kit installed
    locally). Flagged here explicitly rather than silently left implicit:
    the NEXT session that needs to author a brand-new migration should NOT
    trust `bun run db:generate`'s output verbatim until this snapshot gap is
    separately closed -- continue the established convention in this repo
    (hand-author additive, idempotent SQL matching schema.ts, apply via
    Supabase MCP, same as every migration audited above).

projexa_scope_check:
  question: "Does projexa's own Supabase project have the same migration-tracking gap?"
  finding: >
    No -- confirmed out of scope, not "same gap, not yet checked". Queried
    projexa's own Supabase project (evpckeuxgvahguwsaeul) directly:
    `SELECT COUNT(*) FROM drizzle.__drizzle_migrations` fails with
    `relation "drizzle.__drizzle_migrations" does not exist` -- the `drizzle`
    schema itself (which drizzle-kit auto-creates via CREATE SCHEMA IF NOT
    EXISTS on its very first migrate run) has never been created there at
    all. This compliance-tracker repo's drizzle/ folder and drizzle.config.ts
    only ever targeted pcrjmlpuqsbocqfwoxod (DATABASE_URL); projexa is a
    separate frontend product that calls this repo's API routes
    server-to-server via API keys (PROJEXA-IDENTITY-BRIDGE-01, see migrations
    0202/0205/0206/0224/0258's own comments) and evidently manages its own
    Supabase project's schema through a different, non-drizzle-kit path this
    repo has no visibility into. No fix applied or needed here -- there is no
    drizzle migration-tracking mechanism on that project for this audit's
    fix to apply to.

