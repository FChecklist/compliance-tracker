meta:
  title: "Migration Drift Audit + Reconciliation -- compliance-tracker live Supabase project (verdian-ai, pcrjmlpuqsbocqfwoxod)"
  date: "2026-07-26"
  task: "task-20260726-071400-migration-drift-audit-and-reconciliation"
  trigger: >
    Applying phase_1/phase_3's pending migrations 0262/0263 today surfaced that
    drizzle.__drizzle_migrations had 0 rows despite the live DB having hundreds
    of real applied tables, and that migrations 0017 and part of 0018 were
    themselves missing live and had to be manually applied before 0262/0263
    could succeed. This document is the full systematic audit and fix that
    finding demanded, not just the two reactive patches already made today.

root_cause:
  summary: >
    drizzle/meta/_journal.json -- drizzle-kit's own bookkeeping file, read by
    drizzle-orm's readMigrationFiles() to decide which migrations exist at all
    -- has had exactly ONE entry (migration 0000_clammy_may_parker) since the
    file was FIRST committed to this repo. Confirmed via
    `git log -p --follow -- drizzle/meta/_journal.json`: every commit that has
    ever touched this file shows the same single entry; migrations
    0001-0263 (262 real .sql files) were added directly to drizzle/ over many
    waves without a single one of them ever running `drizzle-kit generate` to
    register itself in the journal.
  evidence: >
    Confirmed by downloading and reading drizzle-kit@0.31.0 and
    drizzle-orm@0.45.2's actual published source (npm pack, not guessed):
    dialect.cjs's PgDialect.migrate() and migrator.cjs's readMigrationFiles()
    iterate `journal.entries` ONLY -- they never scan the drizzle/ folder
    directly. With only migration 0000 in the journal, `bun run db:migrate`
    (== `drizzle-kit migrate`) has never once considered migrations 0001+ to
    exist. This explains today's earlier observation precisely: running
    db:migrate blind did not replay the full 263-migration history (that was
    never possible given the journal's real content) -- it replayed ONLY
    migration 0000's raw CREATE TABLE/TYPE statements against a database that
    already has that schema fully built via a different path, hit
    "already exists" errors partway through, and died after printing two
    benign NOTICEs (duplicate_object exceptions caught by 0000's own
    DO $$ EXCEPTION blocks, before hitting a bare CREATE TABLE without an
    IF NOT EXISTS guard).
  contributing_factor: >
    drizzle/0251's own migration comment independently confirms this same
    root cause was already known/documented by a prior session ("drizzle/meta/
    _journal.json in this repo is stale (frozen at migration 0000 while 250
    real .sql files exist untracked by it) -- `bun run db:generate` against it
    produces a bogus 'create the entire schema from scratch' diff") -- prior
    sessions worked around the symptom (hand-writing idempotent SQL and
    applying it out-of-band via Supabase MCP) without ever fixing the
    underlying journal gap itself. This audit is the first pass that actually
    repairs the journal + tracking table rather than working around them again.

scope_note_schema_relocation: >
  Migration 0245_create_platform_schema_compartment.sql (2026-07-19, Owner
  directive) relocated 22 tables + 3 enum types from the `compliance` schema
  to a new `platform` schema mid-history (dynamic_chains, worker_agents*,
  module_registry/product_branches/module_rule_configs,
  instruction_execution_cache, capability_improvement_proposals/
  task_capabilities, fde_requests/automation_rules*, ai_model_registry/
  ai_routing_policies/ai_routing_audit_log/ai_team_role_overrides). Several
  migrations before 0245 target these tables by their original `compliance.`
  qualification; applying them today required retargeting the 2 still-pending
  ones (0140, 0199) at `platform.dynamic_chains` instead of the literal
  migration-file text. drizzle.config.ts's `schemaFilter: ['compliance']` is
  now stale for these 22 tables -- a real, separate, pre-existing gap this
  audit surfaced but did not fix (out of this task's scope; flagged for a
  future session, since widening schemaFilter to include 'platform' is an
  application-schema decision, not a migration-tracking one).

enumeration:
  total_migration_files: 261
  numbering_range: "0000-0263 (three numbers -- 166, 167, 168 -- were never used; confirmed via git log --diff-filter=A/D that no file was ever added or deleted at those numbers, consistent with parallel-agent numbering collisions documented in this repo's own commit history, e.g. 'Renumber migration 0138 -> 0140 (collided with #167's 0138...)' -- not missing DDL, no action needed)"
  cross_reference_method: >
    Not a per-file replay. Extracted every CREATE TABLE / ALTER TABLE ADD
    COLUMN / CREATE INDEX / CREATE TYPE / DROP TABLE / DROP COLUMN / ALTER
    TABLE SET SCHEMA target from all 261 files via regex, then checked each
    target's real existence via batched information_schema.tables /
    information_schema.columns / pg_indexes / pg_type queries against both
    the `compliance` and `platform` schemas on project pcrjmlpuqsbocqfwoxod
    (~5 queries total instead of 261 individual replays). Every finding below
    was independently re-verified with a direct, targeted existence query
    before being classified as genuinely missing, and every "not obviously
    DDL" file left over (RLS policies, seed INSERTs, DROP CONSTRAINT actor-
    column fixes, prompt seeding) was independently checked against live
    pg_constraint / pg_policy / column defaults -- none were found missing.

