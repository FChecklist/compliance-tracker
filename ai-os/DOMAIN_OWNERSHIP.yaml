      - "projexa-ai.com"
      - "www.projexa-ai.com"
    canonical_project:
      name: "projexa"
      id: "prj_JA9mwUdOfW3SKSxjG4jdPo0R2iVM"
    last_verified: "2026-08-16"
    last_verified_by: "desktop PM tier (Claude Desktop, Sonnet 5, direct Vercel REST API), confirmed by task-20260816-142705's own follow-up read of GET /v9/projects/{projexa}/domains and a real HTTP fetch of the live page title"
    history:
      - { date: "2026-07-21", project: "veridian-compliance-ai", event: "WAVE-199 Wave 10 brand-merge cutover (Owner-authorized)", ref: "ai-os/boss/COMPLETED.yaml id: WAVE-199" }
      - { date: "2026-07-27", project: "projexa", event: "undocumented reversal, doer unknown", ref: "cited by WAVE-10-REDO's own summary" }
      - { date: "2026-08-02", project: "veridian-compliance-ai", event: "WAVE-10-REDO, citing Owner decision UMR-20260802-134939-145d", ref: "ai-os/boss/COMPLETED.yaml id: WAVE-10-REDO" }
      - { date: "~2026-08-02..08-07", project: "projexa", event: "another undocumented flip, found by a live re-verification pass", ref: "commit a274c203e (2026-08-07)" }
      - { date: "2026-08-16", project: "veridian-compliance-ai", event: "found wrong again (identical symptom to 2026-07-27), corrected back to projexa same day", ref: "task-20260816-142705-find-and-eliminate-whatever-keeps-reassi" }
