name: Domain Ownership Drift Check

# Read-only guardrail against the recurring projexa-ai.com/www Vercel
# domain misassignment (task-20260816-142705-find-and-eliminate-whatever-
# keeps-reassi, UMR-20260816-142651-d552). Root cause: every prior
# reassignment was a manual, unattended-by-code live Vercel API/CLI action
# by a different agent session (see ai-os/DOMAIN_OWNERSHIP.yaml for the full
# cited history) -- nothing in this repo can technically prevent a manual
# dashboard/API change, so this instead detects drift fast: it polls the
# real Vercel API every 15 minutes and fails (visible in the Actions tab +
# GitHub's own failed-run notification) the moment a domain's live owning
# project stops matching ai-os/DOMAIN_OWNERSHIP.yaml's canonical record.
#
# Installed 2026-08-30 (R1-R64/PR-backlog reconciliation pass, rebasing the
# original PR #1295): the original PR staged this at ai-os/ci-templates/
# domain-drift-check.yml.pending-workflow-scope because that session's git
# push credential lacked the `workflow` OAuth scope GitHub requires for any
# .github/workflows/* change. This session's own push of other workflow
# files (e.g. governance-yaml-parse-check, migration-schema-drift-check)
# succeeded, confirming that credential wall is no longer in the way --
# installing for real rather than leaving it staged.
#
# GET-only. Never calls a mutating Vercel endpoint, and never uses
# `vercel domains rm`/its REST equivalent (see AGENTS.md / DOMAIN_OWNERSHIP.
# yaml's own rule 4 on why: it removes team ownership, a materially more
# destructive operation than what any of these incidents ever needed).
on:
  schedule:
    # GitHub's scheduler does not guarantee exact timing (can slip further
    # under platform load) -- documented honestly, not oversold; still a
    # large improvement over "noticed whenever a human happens to check."
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    name: Verify projexa-ai.com domains still point at the canonical project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The check itself lives in scripts/check-domain-drift.sh so it can be
      # tested against a mock of the Vercel API (scripts/check-domain-drift.
      # test.ts). It reports each HTTP outcome distinctly: a domain that is
      # not attached (404) or attached elsewhere (200, other projectId) is
      # DRIFT and exits 1; an invalid/expired/revoked VERCEL_ACCESS_TOKEN
      # (401/403), an empty secret, or any other API failure means the guard
      # COULD NOT RUN and exits 2 with a message naming the cause -- still a
      # failed run (a guard that cannot run must not look green), but no
      # longer mislabelled as drift. If the token is what failed, replacing
      # the VERCEL_ACCESS_TOKEN repo secret is an owner action.
      - name: Check each domain against ai-os/DOMAIN_OWNERSHIP.yaml
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: bash scripts/check-domain-drift.sh
