# WO-DPDP-011 Step 7: "deploy on merge to main -- to Cloudflare only".
# Ready, not live: this job does NOTHING until the owner adds the two
# Cloudflare secrets (CLOUDFLARE_API_TOKEN with Pages:Edit, and
# CLOUDFLARE_ACCOUNT_ID) and the two PUBLIC build variables
# (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) to this repository. Until then
# every run prints the skip line and exits green. Vercel is never touched
# by this workflow, and vercel.json's ignoreCommand keeps every Vercel
# build skipped regardless. See dpdp-app/DEPLOY.md for the whole procedure.
name: dpdp-app deploy (Cloudflare Pages only)

on:
  push:
    branches: [main]
    paths:
      - "dpdp-app/**"
      - ".github/workflows/dpdp-app-deploy.yml"
  workflow_dispatch:

concurrency:
  group: dpdp-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy dpdp-app to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dpdp-app
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ready, not live -- owner has not added the Cloudflare secrets/variables yet
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "Skipping: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets and/or"
          echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repository variables are not set."
          echo "Nothing was deployed anywhere. See dpdp-app/DEPLOY.md."

      - uses: oven-sh/setup-bun@v2
        if: env.HAS_CLOUDFLARE == 'true'

      - run: bun install --frozen-lockfile
        if: env.HAS_CLOUDFLARE == 'true'

      - name: Build with the PUBLIC Supabase URL and anon key only
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: Bundle key scan -- refuse to deploy if service_role appears
        if: env.HAS_CLOUDFLARE == 'true'
        run: node scripts/scan-bundle.mjs

      - name: Deploy to Cloudflare Pages (production branch main)
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dpdp-app
          command: pages deploy dist --project-name=veridian-dpdp-app --branch=main --commit-dirty=true
