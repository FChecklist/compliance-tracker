# Uptime alarm for every public site. Runs every 15 minutes (free: this repo is public).
# STRICT list: must answer 200 within 20 s (3 tries, 10 s apart). EDGE list: the corporatetambola.com domains refuse
# datacenter bots with 403 (the owner's bot policy), so a 200 or 403 there proves the domain and Cloudflare are up; the app behind
# them is checked through its own pages.dev address in the STRICT list. Any failure fails the run and GitHub e-mails the account
# that owns this workflow. To add a site, add its address to a list. Read-only: GET requests only.
name: Uptime alarm
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check every site
        run: |
          STRICT="
          https://corporate-tambola.pages.dev/
          https://corporate-bingo.pages.dev/
          https://corporate-snakes-and-ladders.pages.dev/
          https://corporate-luck-by-chance.pages.dev/
          https://corporate-tic-tac-toe.pages.dev/
          https://corporate-games.pages.dev/
          https://app.veridian-aios.com/
          https://veridian-aios.com/
          https://rajatsir.com/
          https://rajat-agarwal-startup-coach.pages.dev/
          https://itservices-rajat-agarwal.pages.dev/
          https://shobhakamalsolutions.pages.dev/
          "
          EDGE="
          https://corporatetambola.com/
          https://bingo.corporatetambola.com/
          https://snakes.corporatetambola.com/
          https://luck.corporatetambola.com/
          https://tictactoe.corporatetambola.com/
          https://games.corporatetambola.com/
          "
          bad=""
          probe() { # $1 = address, $2 = accepted codes
            for try in 1 2 3; do
              code=$(curl -sL -o /dev/null -m 20 -w '%{http_code}' "$1" || true)
              case " $2 " in *" $code "*) echo "UP   $1 ($code)"; return 0;; esac
              sleep 10
            done
            echo "DOWN $1 (last answer: $code)"; return 1
          }
          for u in $STRICT; do probe "$u" "200" || bad="$bad $u"; done
          for u in $EDGE; do probe "$u" "200 403" || bad="$bad $u"; done
          if [ -n "$bad" ]; then echo "::error::DOWN:$bad"; exit 1; fi
