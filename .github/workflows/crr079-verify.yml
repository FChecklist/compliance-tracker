name: CRR-079 Closure Proof (temporary, one-time)
# ONE-TIME verification workflow for platform.crr_spec CRR-079 -- runs the
# real chunk+embed bridge against the real database and a real embedding
# provider using this repo's own secrets (never available to the agent
# session that authored this workflow directly).
#
# workflow_dispatch requires the workflow file to already exist on the
# default branch before GitHub will register/dispatch it -- not true yet for
# a file that only exists on this PR branch -- so this instead uses
# pull_request (same event ci.yml already reacts to on this exact open PR,
# #1398), scoped narrowly via `paths:` to only this file and the verify
# script so it does not run on any other change to this PR. Same-repo PR
# (not a fork), so secrets are available.
# Removed in a follow-up commit on this branch once CRR-079's evidence is
# captured -- not part of the merged CRR-100 P3 PR surface.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/crr079-verify.ts"
      - ".github/workflows/crr079-verify.yml"

jobs:
  verify:
    name: Run CRR-079 verify script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/crr079-verify.ts
        env:
          # DATABASE_URL is set only as a defensive no-op (some transitively-
          # imported module might read it at import time) -- this script
          # deliberately never opens a DB connection; see its own header for
          # why (this repo's DATABASE_URL secret was confirmed BOM-prefixed
          # and, once stripped, pointed at a stale/wrong Supavisor tenant).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
