name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
        env:
          # R60 T7 follow-up: this job crashed with the same V8
          # OOM/core-dump signature as the Build job (see the NODE_OPTIONS
          # comment on the build step below) under concurrent CI load from
          # many PRs re-running at once. Same fix, same reasoning.
          NODE_OPTIONS: --max-old-space-size=8192
  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate || true
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          # R60 T7: `next build`'s internal type-check pass (distinct from the
          # standalone `typecheck` job above, which uses plain `tsc --noEmit`
          # and was passing) was OOM-crashing on ubuntu-latest's default V8
          # old-space ceiling (~2GB) -- confirmed via the GC-thrash-then-crash
          # signature in every recent run (e.g. run 33102828718, job Build).
          # This failed identically on every open PR regardless of that PR's
          # own diff, so it was a repo-wide infra gap, not a per-PR defect.
          # ubuntu-latest has 16GB total; 8GB old-space leaves headroom for
          # the rest of the toolchain (bun, next's own worker processes).
          NODE_OPTIONS: --max-old-space-size=8192
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # R76 (2026-09-06, Vercel deploy lockdown, A3-03): a file-existence
      # check that does NOT depend on the guarded file's own content to run
      # -- src/lib/vercel-lockdown.test.ts's assertions only execute if the
      # file itself still exists, so deleting it silently drops those
      # assertions rather than failing anything, unlike a config value being
      # merely weakened. This step fails the job outright if the file is
      # gone, independent of whatever `bun test` below would or wouldn't
      # catch. See platform.crr_ruling R76-RULING-01.
      - name: Guard against deleting the Vercel-lockdown drift test
        run: test -f src/lib/vercel-lockdown.test.ts || (echo "::error::src/lib/vercel-lockdown.test.ts is missing -- this is the Layer 3 drift guard for the Vercel deploy lockdown (R76-RULING-01). Restore it, do not just let this fail silently." && exit 1)
      # Wave 79: real test files now exist (src/lib/*.test.ts), so
      # --passWithNoTests is dropped -- a future PR that deletes all tests
      # should fail CI, not pass silently. Placeholder DB env vars mirror
      # the `build` job's precedent above: importing policy-enforcement-
      # engine.ts transitively constructs the src/lib/db/index.ts client at
      # module-load time, which throws without *some* connection string
      # present, even though these tests never issue a real query.
      # R60 E-138: bun's mock.module() mutates a GLOBAL, process-wide module
      # registry. Without --isolate (a fresh global object per test file),
      # one file's mock.module() call for a given specifier can leak into or
      # get overwritten by another file's mock.module() call for the SAME
      # specifier when many files run in one process -- causing tests to
      # silently pass by borrowing a different file's leaked mock, or fail
      # unpredictably when that borrowed state is wrong. Root-caused and
      # fixed across 7 files in this pass (#1421, #1423-#1428); --isolate
      # is what actually closes the leak at the CI level going forward.
      #
      # R1-R64 recheck (2026-08-30): bare `bun test --isolate` (no path) only
      # discovers files under bunfig.toml's `[test] root = "src"` -- it was
      # SILENTLY never running the 8 real test files under scripts/
      # (check-migration-integrity.test.ts, check-sec07-ocid-lock.test.ts,
      # check-reviewer-not-author.test.ts, and 5 others), including two
      # governance/security-critical checks. Confirmed via
      # `bun test --isolate ./scripts` discovering and passing all 8 (137
      # tests) that the bare invocation silently skipped. Two explicit
      # invocations, not `bun test --isolate src scripts`, because passing
      # multiple root-level paths this way still only honors bunfig.toml's
      # single configured root for module resolution within each run.
      - run: bun test --isolate
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          APP_RUNTIME_DATABASE_URL: postgresql://app_runtime:placeholder@localhost:5432/postgres
      - run: bun test --isolate ./scripts
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          APP_RUNTIME_DATABASE_URL: postgresql://app_runtime:placeholder@localhost:5432/postgres
  migration-collision-check:
    name: Migration Number Collision Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # 2026-07-30: this repo has hit real drizzle/*.sql migration-number
      # collisions from concurrent workers repeatedly (PRs #645/#650/#651/
      # #652/#653/#654/#655, plus two pre-existing collisions found already
      # merged into main: 0225 and 0269 -- fixed in the same PR that added
      # this job). The checker script existed before this PR but was never
      # wired into CI, and separately had a stale-base-ref bug (it used to
      # fall back to the local `main` ref, which drifts stale in shared
      # checkouts/worktrees and can misreport historical collisions as new,
      # or miss real new ones). Both are fixed together here: the script
      # now prefers a freshly-fetched origin/main (with --base/BASE_REF
      # override available for callers that need one), and this job passes
      # --base origin/main explicitly for determinism in CI. fetch-depth 0
      # (matching terminology-guardrail-check's own precedent just above)
      # so the script's git merge-base/diff against origin/main always
      # resolves. Honest limitation: this is a CI-gate-catches-it-after-
      # the-fact check, not a reservation/lock on migration numbers --
      # concurrent agents can still race to claim the same "next free"
      # number before either one's PR is opened; this job only guarantees
      # the collision is caught (and must be fixed) before merge, not that
      # it can never happen. See the script's own header for the same
      # honest-limitation note.
      - run: node scripts/check-migration-collision.mjs --base origin/main
  route-error-handling-check:
    name: Route Error Handling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # VERIDIAN Review Framework gap-closure (task-20260718-065003-
      # ai-engineering-quality--error-handling), [Low] Error Handling
      # Quality: "~9% of API routes lack a visible try/catch." Same
      # enforcement class as the coverage checks above -- fails the build
      # only on NEW or MODIFIED src/app/api/**/route.ts files (relative to
      # origin/main) that export an HTTP handler with no visible try/catch,
      # so pre-existing debt doesn't retroactively fail every PR. fetch-depth
      # 0 + --base origin/main, matching migration-collision-check's own
      # precedent just above (same "stale local main ref" fix). See the
      # script's own header for the honest limitation this does and doesn't
      # guarantee.
      - run: node scripts/check-route-error-handling.mjs --base origin/main
      # R81 K1-02 / fault R81_F29. check-route-auth-guard.mjs was written,
      # committed, and never wired -- its own header records why: "NOT yet wired
      # into .github/workflows/ci.yml as of this commit -- this session's git
      # token lacks the workflow OAuth scope", and it writes out this exact
      # command. Verified still unwired on 2026-09-08: ci.yml ran ten other
      # check-*.mjs steps and not this one, so the CLAUDE.md-mandated "every API
      # route MUST call requireAuth()" convention was unenforced and a new
      # unguarded route passed CI clean. Same --base origin/main / fetch-depth 0
      # shape as the step above, so only NEW or MODIFIED routes fail the build.
      - run: node scripts/check-route-auth-guard.mjs --base origin/main
      # R81 K1-04 / fault R81_F33. Registry check: every documented defect
      # comment must keep a live fault row, and vice versa. NOT an age-based
      # TODO check -- the K1 sweep found ZERO TODO/FIXME markers in either repo,
      # so an age check would pass on an empty set and report false assurance.
      # Defects here are documented in prose; this checks those.
      - run: node scripts/check-comment-rot.mjs
      # R81 K5-08, REPORT-ONLY on purpose (same pattern as the E-103 replay job
      # below). This fails today, by design: six requirements are recorded CLOSED
      # citing e2e/demo-gate-smoke.spec.ts, which skips itself whenever real
      # production answers DEPLOYMENT_PAUSED -- which it does, because Vercel is
      # paused deliberately. The CI log is the proof: the E2E job prints
      # "3 skipped, 6 passed" and concludes SUCCESS, so a skipped test sits inside
      # a GREEN job and no CI-outcome check can tell "requirement holds" apart
      # from "requirement never ran".
      # It is NOT blocking yet because the remedy -- reverting those six, or
      # proving them against environment 1 (E2E_PROJEXA_ORIGIN=http://localhost:3100)
      # -- is owner-sequenced work (R81 Addendum B, G2-02) and turning CI red for
      # every contributor in the meantime would just get this switched off.
      # FLIP continue-on-error TO false the moment that lands; the script then
      # stops any NEW self-skipping citation from being recorded as closure proof.
      - run: node scripts/check-closure-citation-skips.mjs
        continue-on-error: true
  migration-integrity-check:
    name: Migration Integrity Check (AR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # R60 (2026-08-28), closes the enforcement half of platform.r43_faults
      # fault_id E102_MIGRATION_LEDGER_LINE_ENDING_HASH_SPLIT: AR-12
      # (platform.arch_rules) says CI must prove three things agree for every
      # migration -- the .sql file, the journal entry, and the applied
      # database row -- and until this job, nothing checked that at all
      # (`git grep -in "AR-12"` across this whole repo returned zero hits).
      # See scripts/check-migration-integrity.mjs's own header comment for
      # the full reasoning, most importantly: a real, already-investigated
      # CRLF/LF hash split exists in the live ledger (138 rows hashed from a
      # Windows checkout / 157 from an LF checkout, confirmed live
      # 2026-08-28) because drizzle-orm hashes raw file bytes with no
      # line-ending normalization. This job tolerates that split -- rewriting
      # an already-applied migration file's bytes, or the ledger's recorded
      # hash, is a real risk to a live system this job does not take
      # unilaterally -- while still failing on genuine content drift, and
      # while still failing (regardless of DB access) if .gitattributes ever
      # stops forcing a single line-ending convention for NEW drizzle/*.sql
      # files (the piece that stops this exact class of drift recurring).
      # DATABASE_URL uses the same real secret db-migrate.yml already uses;
      # unlike that job this one only ever SELECTs (read-only) and, per the
      # script's own header, treats an unreachable DB as a warning, not a
      # failure -- prod downtime must not block every PR in the repo from
      # merging.
      # R67B (2026-09-03) added two E-74 gates inside this same script
      # (platform.r43_faults fault_id E74_MIGRATOR_CURSOR_ORPHANS_MIGRATIONS),
      # so no new job is needed for them:
      #   - DB-free, always runs: no NEW migration may carry a `when`
      #     timestamp at or below an entry already ahead of it in the journal
      #     array. drizzle-kit migrate gates on a single max(created_at)
      #     watermark, so such a migration becomes permanently unreachable the
      #     moment anything that overtook it is applied -- skipped silently,
      #     exit 0. Catching it on the PR is the only cheap moment.
      #   - DB-backed, degrades to a warning without DATABASE_URL exactly like
      #     the hash leg: zero journal entries may be orphaned (no applied row
      #     AND at/below the watermark). Three real ones existed on
      #     2026-09-03 and were repaired; this keeps the count at zero.
      - run: node scripts/check-migration-integrity.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # R81 (2026-09-08): the file<->journal leg of AR-12, which the script
      # above deliberately does NOT check (see its header: it cites the three
      # 0294-0296 orphans as the reason a hard parity rule would fail).
      # By 2026-09-08 that exception had grown from three files to sixteen and
      # nothing was counting. It matters because BOTH the migrate runner and
      # the replay-from-empty harness below iterate journal.entries -- a .sql
      # file with no journal entry is never applied and never replayed, so the
      # replay job reports green while the schema it proves is incomplete.
      # Four migrations were in exactly that state when this was written,
      # applied live through Supabase's migration ledger, which nothing in this
      # repository reads. DB-free, so it always runs.
      - run: node scripts/check-migration-journal-parity.mjs
  migration-replay-from-empty:
    # R67B (2026-09-03), platform.r43_faults fault_id
    # E103_MIGRATION_REPLAY_EMPTY_DB_BREAK. E-103 says a fresh database cannot
    # be built by replaying drizzle/ from empty. It had been triaged four
    # times without ever being RUN, because no throwaway Postgres was
    # available to whoever was triaging; each pass reasoned from file contents
    # and reached a different, more optimistic, wrong answer.
    #
    # This job runs it, on real Postgres (PGlite -- Postgres compiled to WASM,
    # no server or Docker needed). It is REPORT-ONLY and deliberately does not
    # gate merges: as of 2026-09-03 only 50 of 360 journal entries apply
    # cleanly, the first failure is at array position 3, and the cause is that
    # 95 live tables plus compliance.current_org_id() have no CREATE TABLE or
    # CREATE FUNCTION anywhere in the migration folder (most of this schema was
    # built with `db:push`, which writes nothing to drizzle/). Fixing that is
    # deliberate schema archaeology needing its own reviewed PR, so failing
    # every build on it today would only teach people to ignore a red check.
    #
    # What it does provide is a number that moves. Anyone attempting the
    # baseline can now prove progress in one command instead of arguing from
    # file contents, and any regression shows up in the log. Add --strict to
    # the run below on the day a clean replay is expected to hold.
    name: Migration Replay From Empty (E-103, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/replay-migrations-from-empty.mjs --report
  governance-yaml-parse-check:
    # GAP-CI-WORKFLOW-FILE-PUSH-BLOCKED-MISSING-OAUTH-SCOPE (ai-os/
    # MASTER-TRACKER.yaml, closed 2026-08-30, R1-R64 recheck): this job and
    # scripts/check-governance-yaml-parse.mjs were both written and verified
    # locally back on 2026-08-03 (catches the exact class of silent
    # 0-indent-duplicate YAML corruption fixed for
    # GAP-ACTIVE-CLAIMS-YAML-PARSE-ERROR), but wiring this one line into
    # ci.yml was blocked for weeks: that session's only git-push credential
    # (a shared server OAuth token) lacked the `workflow` scope GitHub
    # requires to push a `.github/workflows/*` change, and no
    # differently-scoped credential was available. This session's own
    # `git push` of this exact file succeeded, confirming the credential
    # blocking this is no longer in the way (the VERIDIAN-DEV server this
    # ran on was independently decommissioned 2026-08-25, see
    # feedback_bypass_server_direct_work memory).
    name: Governance YAML Parse Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-governance-yaml-parse.mjs
  migration-schema-drift-check:
    # GAP-MIGRATION-APPLY-NOT-AUTOMATED (ai-os/MASTER-TRACKER.yaml, closed
    # 2026-08-30, R1-R64 recheck): distinct from migration-integrity-check
    # (AR-12) above -- that job proves a migration FILE's bytes still match
    # what the ledger recorded as applied; this job proves the DDL the file
    # describes actually EXISTS in the live schema. The real incident this
    # closes: drizzle/0264_helpdesk_tiered_sla_team_routing.sql was recorded
    # applied but its DDL never actually ran on production, causing a real
    # live 500 on GET /api/email-intelligence. See
    # scripts/check-migration-schema-drift.mjs's own header for the full
    # design (parses CREATE TABLE / ALTER TABLE ADD COLUMN, replays
    # add/drop in journal order, checks schema-agnostically against
    # information_schema to tolerate legitimate post-migration schema moves
    # like compliance.worker_agents -> platform.worker_agents). Verified
    # against real production data before landing: 458 expected tables + 356
    # expected columns parsed from all 305 real migration files, zero
    # missing live.
    name: Migration Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-migration-schema-drift.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
  screen-definition-labels-check:
    # R67 lane I (WS-I item I-01). compliance.screen_definitions is the M28
    # screen registry PROJEXA renders its column headers from, and two rows
    # shipped with a debugging label baked into their `columns` jsonb -- both of
    # them GLOBAL (org_id NULL) rows, so both leaked into every tenant
    # (a018f269-8375-44a5-a9ed-1060bf4d3efc = schedule.timeline, and
    # 4b1ff3d4-6877-4a10-89cc-ceb4d6f90ca1 = dashboard.dashboard). drizzle/0528
    # and drizzle/0531 correct the data; this job is what stops it recurring.
    # Placed beside the other DATABASE_URL-reading guard jobs above and, exactly
    # like them, treats a missing/unreachable database as a warning rather than
    # a failure (prod downtime must not block every PR in the repo) -- a
    # REACHABLE database with a live debug label does fail the build. Read-only:
    # the script only ever SELECTs. See
    # scripts/check-screen-definition-labels.mjs's own header for why the rule
    # is the audit's literal /test/i and why a genuine "test"-containing label
    # is handled by a reviewed allowlist entry, never by loosening the pattern.
    #
    # TEMPORARY continue-on-error, and the ONLY honest option here. The live
    # registry still holds both leaked labels -- the migrations that clean them
    # are applied by the PM through Supabase MCP AFTER merge, which is this
    # repo's standing procedure for data migrations. So on the day this job
    # lands it would fail not just on its own PR but on every other open PR in
    # the repo, for a defect none of them introduced. The rule itself is NOT
    # weakened to buy that (AGENTS.md Rule 9): the pattern is still the audit's
    # literal /test/i, ALLOWED_TEST_LABELS is still empty, and the job still
    # runs and still prints the offending rows on every PR.
    # FOLLOW-UP, REQUIRED, one line: once the PM has applied drizzle/0528 and
    # drizzle/0531 and the verification SELECT in 0531's header returns zero
    # rows, delete the `continue-on-error: true` below so the job blocks again.
    name: Screen Definition Label Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-screen-definition-labels.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
  graph-drift-check:
    # R67 Part B, item 1.7 (PART_B_STATUS.md "1.7 remaining" section) -- CI
    # wrapper around the self-healing SQL pair applied and proven live in
    # migration r67b_phase1_7_reconciling_rebuild:
    # platform.graph_reconcile_platform_tier() + platform.graph_full_resync().
    # Same class of check as Migration Schema Drift Check just above (a
    # committed derivation vs. the live schema can silently drift apart) but
    # for the schema/type-tier knowledge graph (graph_node/graph_edge)
    # instead of Drizzle migrations: graph_full_resync() reconciles (deletes
    # platform-tier rows whose source -- a table, an FK constraint, an
    # asset_registration_config entry -- no longer exists) THEN rebuilds
    # (re-adds anything missing), and on a system with no real drift every
    # step must return row_count=0. A non-zero row_count means the committed
    # graph-builder SQL and the live schema have drifted apart, or
    # graph_node/graph_edge were hand-edited outside the builders. See
    # scripts/verify-graph-drift.mjs's own header for the full design and
    # its honest limitations. graph_full_resync() is SECURITY DEFINER and
    # only ever touches tier='platform' rows (never tenant tier='instance'
    # data) -- app_runtime was granted EXECUTE on it specifically for this
    # check (migration r67b_phase1_7_grant_graph_resync_ci). Same
    # DATABASE_URL secret Migration Schema Drift Check already uses; same
    # unreachable-DB-warns-not-fails convention.
    name: Graph Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/verify-graph-drift.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
  new-test-coverage:
    name: New Test Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs real history to compute a merge-base against origin/main --
          # the default fetch-depth: 1 checkout only has this PR's own
          # commit(s), which is not enough for `git merge-base` to find a
          # common ancestor. See the script's own header for why the diff
          # (not just static file state, unlike this file's other coverage
          # checks) is the mechanism here.
          fetch-depth: 0
      # VERIDIAN Review Framework gap-closure ("AI Can Safely Modify
      # Module": "CI gate does not include comprehensive behavioral test
      # coverage") -- fails the build if this PR touches a
      # src/lib/services/*.ts file that had zero test coverage before this
      # PR, and the PR adds no test anywhere. Installed 2026-08-30
      # (R1-R64/PR-backlog reconciliation pass, rebasing original PR #1259
      # -- that session's git-push credential lacked the `workflow` OAuth
      # scope this file needs; this session's own workflow-file pushes
      # succeeded, confirming that wall no longer applies). See the
      # script's own header for the honest limitation this does and
      # doesn't guarantee.
      - run: node scripts/check-new-test-coverage.mjs
  test-coverage-gap-report:
    name: Test Coverage Gap Report Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # VERIDIAN Review Framework gap-closure ("AI Can Generate Tests for
      # Module": "No systematic test-generation tooling") -- fails the build
      # if docs/master/TEST_COVERAGE_GAP.md is stale relative to the current
      # src/lib/services tree, so the report stays trustworthy instead of
      # silently rotting the moment a new service file is added. Installed
      # 2026-08-30, same rebase as new-test-coverage above.
      - run: node scripts/report-test-coverage-gap.mjs --check
  e2e:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # R38/R-B1 (Master v5 E-38): `|| true` used to mean a failed browser
      # install still let this job "pass" with zero tests actually run.
      # e2e/demo-gate-smoke.spec.ts (R38) is real now -- a failed install
      # must fail the job like any other real dependency. --pass-with-no-
      # tests is gone for the same reason: a real test exists, so a run
      # that somehow discovers none again is itself a real failure, not an
      # honest limitation to wave through.
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
  e2e-env1:
    # T2 (W-CI, window W20260910-2248, PM ruling D78): the Env-1 CI job.
    # Answers the recorded next_action on 17 requirements (R-11/15/30/31/41/
    # 42/43/60/82/90/91 + R-01/02/32/40/B1/B2): "bind a Playwright spec
    # against environment 1 (localhost) and let it go green in CI" -- until
    # this job, nothing in either repo's CI booted BOTH apps together, so
    # every one of those specs could only ever be run by hand.
    #
    # WHY BOTH APPS, ONE JOB. r01-r02/r32/r40-*-env1.spec.ts (this repo) and
    # projexa's own r60-boq-currency-env1.spec.ts all exercise PROJEXA's own
    # UI/API surface, and PROJEXA's real business data (BOQs, projects)
    # proxies through THIS repo's VERIDIAN API bridge
    # (VERIDIAN_API_BASE_URL=http://localhost:3000/api/v1/projexa, see
    # projexa/.env.local's own documented convention) -- a locally-booted
    # PROJEXA with no locally-booted ct backend behind it can authenticate
    # but cannot serve real data, which is exactly what these specs assert
    # against. PR #1629's DOD-S1 job deliberately avoided this same
    # dual-boot requirement for ITS narrower route (a ct-side API key
    # instead) -- that choice does not apply here, these specs already use
    # PROJEXA's own mint-session-r33/GoTrue auth against PROJEXA_ORIGIN
    # directly, not ct's API. PM ruling D78: this is a genuinely different
    # requirement (multi-repo boot), not a repeat of the W-ROUTER
    # do_not_redo note that said a cross-repo dev-server stack was never
    # needed for DOD-X4 specifically.
    #
    # WHY THE JOB LIVES HERE, NOT IN PROJEXA'S ci.yml. GitHub Actions
    # secrets are scoped strictly to the repo whose workflow is running --
    # FChecklist is a personal account, not an Organization, so there is no
    # shared/org-level secret to fall back on (confirmed live via `gh api
    # users/FChecklist`, .type == "User"). Hosting the job here means only
    # THIS repo's secret store needs both apps' real values; hosting it in
    # projexa would need the reverse (4 ct secrets duplicated there, vs 2
    # here). Both repos are public, so the cross-repo checkout below needs
    # no special token.
    #
    # SECRETS THIS JOB NEEDS THAT DO NOT YET EXIST (OR-7, owner-only, never
    # via a shell -- see kt/FINDINGS.W-CI.jsonl F-2026-09-10-W-CI-001):
    #   PROJEXA_DATABASE_URL -- PROJEXA's own Postgres connection string
    #     (evpckeuxgvahguwsaeul), distinct from this repo's own DATABASE_URL
    #     secret (a different Supabase project). Construct the same way
    #     db-migrate.yml's DATABASE_URL is built (postgres.<ref>:<password>@
    #     <pooler-host>:6543/postgres, transaction-mode pooler) -- verify the
    #     working host/port live once the password is in, the same
    #     trial-and-error db-migrate.yml's own header already documents for
    #     this repo's project; do not assume the same pooler region.
    #   VERIDIAN_API_KEY -- the bridge auth PROJEXA's backend sends ct on
    #     every VERIDIAN_API_BASE_URL call. Real value already exists
    #     locally (projexa/.env.local, gitignored, never committed) -- the
    #     owner can copy that same value in directly, this does not need to
    #     be a new/rotated key.
    # NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY for PROJEXA are
    # PUBLIC/client-exposed by design (PM confirmed, D78) -- baked directly
    # into this file below, not secrets, matching the same anon key already
    # hardcoded in this repo's own r01-r02/r32/r40 spec files.
    #
    # FALSIFIABILITY (D58): NOT YET RUN as of this commit -- this job cannot
    # produce a real result until OR-7 lands. Once it does: break one
    # assertion (e.g. r32's expected total), push, confirm RED with a real
    # run id, revert, confirm GREEN with a second real run id, record both --
    # same pattern already used for DOD-X4/DOD-R3. Do not report this job
    # green from a claim; only from an observed run.
    name: E2E Tests (Env-1, cross-repo)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Fail fast and loud, not 2 build+boot steps later, the moment OR-7/
      # OR-8 land wrong or get missed -- same "a missing required secret
      # must fail loudly, not silently skip and report success" principle
      # scripts/check-project-budgets-live.mjs already uses for
      # DOD_S1_SMOKE_API_KEY. Checked before either checkout does real work
      # so a misconfigured run fails in <5s, not after a 2+ minute build.
      - name: Verify required secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing="$missing DATABASE_URL"
          [ -z "${{ secrets.APP_RUNTIME_DATABASE_URL }}" ] && missing="$missing APP_RUNTIME_DATABASE_URL"
          [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "${{ secrets.PROJEXA_DATABASE_URL }}" ] && missing="$missing PROJEXA_DATABASE_URL"
          [ -z "${{ secrets.VERIDIAN_API_KEY }}" ] && missing="$missing VERIDIAN_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::e2e-env1 cannot run: missing repo secret(s):$missing -- see kt/FINDINGS.W-CI.jsonl F-2026-09-10-W-CI-001 / OR-7 / OR-8 (owner-only, direct GitHub UI entry, never via a shell)."
            exit 1
          fi
          echo "all 6 required secrets present (values not printed)"
      - name: Checkout compliance-tracker
        uses: actions/checkout@v7
      - name: Checkout projexa (sibling dir)
        uses: actions/checkout@v7
        with:
          repository: FChecklist/projexa
          ref: main
          path: projexa-checkout
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install projexa deps
        run: bun install --frozen-lockfile
        working-directory: projexa-checkout

      # --- Boot THIS repo's real backend on :3000 first -- PROJEXA calls it
      # via VERIDIAN_API_BASE_URL below, so it must already be up before
      # PROJEXA's own readiness probe can return real data. Same real
      # `next start` production-server pattern PR #1629's DOD-S1 job already
      # proved live (build once here, not reused from the separate `build`
      # job above -- GitHub Actions jobs do not share a filesystem).
      - run: bun run db:generate || true
      - name: Build compliance-tracker
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Start compliance-tracker (background, :3000)
        run: nohup bunx next start -p 3000 > ct-server.log 2>&1 & echo $! > ct-server.pid
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_RUNTIME_DATABASE_URL: ${{ secrets.APP_RUNTIME_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Wait for compliance-tracker to accept connections
        run: |
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://localhost:3000/api/organization"; then
              echo "ct responding after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::compliance-tracker never accepted a connection on :3000 within 120s"
          cat ct-server.log || true
          exit 1

      # --- Boot PROJEXA's real backend on :3100, pointed at the ct instance
      # above via VERIDIAN_API_BASE_URL (same convention projexa/.env.local
      # already documents for local dev).
      - name: Build projexa
        run: bun run build
        working-directory: projexa-checkout
        env:
          DATABASE_URL: ${{ secrets.PROJEXA_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: https://evpckeuxgvahguwsaeul.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_f0C6ZvVjEnwkdN7wxfEwBQ_x69zrGs8
      - name: Start projexa (background, :3100)
        working-directory: projexa-checkout
        run: nohup bunx next start -p 3100 > ../projexa-server.log 2>&1 & echo $! > ../projexa-server.pid
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PROJEXA_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: https://evpckeuxgvahguwsaeul.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_f0C6ZvVjEnwkdN7wxfEwBQ_x69zrGs8
          VERIDIAN_API_BASE_URL: http://localhost:3000/api/v1/projexa
          VERIDIAN_API_KEY: ${{ secrets.VERIDIAN_API_KEY }}
      - name: Wait for projexa to accept connections
        run: |
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://localhost:3100/login"; then
              echo "projexa responding after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::projexa never accepted a connection on :3100 within 120s"
          cat projexa-server.log || true
          exit 1

      # --- Run this repo's 3 Env-1 specs against the already-running :3100
      # PROJEXA instance. E2E_ENV1_JOB=true tells playwright.config.ts to
      # reuse the ct server already running on :3000 above instead of trying
      # to launch its own dev-mode copy on the same port (which would error
      # "port already in use" -- reuseExistingServer defaults to false in CI
      # for the regular `e2e` job above, deliberately, so that job still
      # proves it boots its OWN server from cold; this job already proved
      # that above with a real production boot, so reusing here is correct,
      # not a weaker check).
      - run: bunx playwright install --with-deps chromium
      - name: Run compliance-tracker Env-1 specs
        run: bunx playwright test e2e/r01-r02-boq-create-env1.spec.ts e2e/r32-boq-total-excludes-subtasks-env1.spec.ts e2e/r40-work-progress-weighted-subtask-env1.spec.ts
        env:
          E2E_PROJEXA_ORIGIN: http://localhost:3100
          E2E_ENV1_JOB: "true"

      # --- Run projexa's own R-60 spec under projexa's OWN playwright
      # config (auth.setup.ts + storageState, a different fixture
      # convention to this repo's mint-session-r33/GoTrue flow) -- separate
      # browser install, this repo's node_modules/playwright and projexa's
      # are independent installs.
      - name: Install projexa's playwright browsers
        working-directory: projexa-checkout
        run: bunx playwright install --with-deps chromium
      - name: Run projexa Env-1 spec (R-60)
        working-directory: projexa-checkout
        run: bunx playwright test e2e/r60-boq-currency-env1.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100

      - name: Server logs (always shown, for debugging any outcome)
        if: always()
        run: |
          echo "--- compliance-tracker (:3000) ---"; cat ct-server.log || true
          echo "--- projexa (:3100) ---"; cat projexa-server.log || true
      - name: Stop background servers
        if: always()
        run: |
          kill "$(cat ct-server.pid)" 2>/dev/null || true
          kill "$(cat projexa-server.pid)" 2>/dev/null || true
