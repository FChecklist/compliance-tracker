name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate || true
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          # R60 T7: `next build`'s internal type-check pass (distinct from the
          # standalone `typecheck` job above, which uses plain `tsc --noEmit`
          # and was passing) was OOM-crashing on ubuntu-latest's default V8
          # old-space ceiling (~2GB) -- confirmed via the GC-thrash-then-crash
          # signature in every recent run (e.g. run 33102828718, job Build).
          # This failed identically on every open PR regardless of that PR's
          # own diff, so it was a repo-wide infra gap, not a per-PR defect.
          # ubuntu-latest has 16GB total; 8GB old-space leaves headroom for
          # the rest of the toolchain (bun, next's own worker processes).
          NODE_OPTIONS: --max-old-space-size=8192
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Wave 79: real test files now exist (src/lib/*.test.ts), so
      # --passWithNoTests is dropped -- a future PR that deletes all tests
      # should fail CI, not pass silently. Placeholder DB env vars mirror
      # the `build` job's precedent above: importing policy-enforcement-
      # engine.ts transitively constructs the src/lib/db/index.ts client at
      # module-load time, which throws without *some* connection string
      # present, even though these tests never issue a real query.
      # R60 E-138: bun's mock.module() mutates a GLOBAL, process-wide module
      # registry. Without --isolate (a fresh global object per test file),
      # one file's mock.module() call for a given specifier can leak into or
      # get overwritten by another file's mock.module() call for the SAME
      # specifier when many files run in one process -- causing tests to
      # silently pass by borrowing a different file's leaked mock, or fail
      # unpredictably when that borrowed state is wrong. Root-caused and
      # fixed across 7 files in this pass (#1421, #1423-#1428); --isolate
      # is what actually closes the leak at the CI level going forward.
      - run: bun test --isolate
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          APP_RUNTIME_DATABASE_URL: postgresql://app_runtime:placeholder@localhost:5432/postgres
  migration-collision-check:
    name: Migration Number Collision Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # 2026-07-30: this repo has hit real drizzle/*.sql migration-number
      # collisions from concurrent workers repeatedly (PRs #645/#650/#651/
      # #652/#653/#654/#655, plus two pre-existing collisions found already
      # merged into main: 0225 and 0269 -- fixed in the same PR that added
      # this job). The checker script existed before this PR but was never
      # wired into CI, and separately had a stale-base-ref bug (it used to
      # fall back to the local `main` ref, which drifts stale in shared
      # checkouts/worktrees and can misreport historical collisions as new,
      # or miss real new ones). Both are fixed together here: the script
      # now prefers a freshly-fetched origin/main (with --base/BASE_REF
      # override available for callers that need one), and this job passes
      # --base origin/main explicitly for determinism in CI. fetch-depth 0
      # (matching terminology-guardrail-check's own precedent just above)
      # so the script's git merge-base/diff against origin/main always
      # resolves. Honest limitation: this is a CI-gate-catches-it-after-
      # the-fact check, not a reservation/lock on migration numbers --
      # concurrent agents can still race to claim the same "next free"
      # number before either one's PR is opened; this job only guarantees
      # the collision is caught (and must be fixed) before merge, not that
      # it can never happen. See the script's own header for the same
      # honest-limitation note.
      - run: node scripts/check-migration-collision.mjs --base origin/main
  e2e:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # R38/R-B1 (Master v5 E-38): `|| true` used to mean a failed browser
      # install still let this job "pass" with zero tests actually run.
      # e2e/demo-gate-smoke.spec.ts (R38) is real now -- a failed install
      # must fail the job like any other real dependency. --pass-with-no-
      # tests is gone for the same reason: a real test exists, so a run
      # that somehow discovers none again is itself a real failure, not an
      # honest limitation to wave through.
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
