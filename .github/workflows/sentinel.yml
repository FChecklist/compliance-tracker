name: Sentinel Governance Checks
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Deployment Security gap-closure (Cloud Deployment / Deployment
      # Operations review, "secret-scan is advisory not blocking"):
      # `continue-on-error: true` previously swallowed a real gitleaks
      # finding so this job always reported success regardless of its own
      # result. Removed -- a genuine leak now fails this job for real.
      # Follow-up (not done blind in this same change): add "Secret
      # Scanning" to the repo's required_status_checks once a few real
      # runs of this job on the live history have been confirmed clean --
      # that's a repo-wide branch-protection change affecting every PR
      # from every concurrent session, so it needs its own verified,
      # deliberate rollout rather than riding in as a side effect here.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  docs-check:
    name: Documentation Sentinel Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SENTINEL.md exists
        run: |
          if [ ! -f SENTINEL.md ]; then echo "::error::SENTINEL.md missing"; exit 1; fi
          echo "SENTINEL.md present"
  security-pattern-check:
    name: Security Pattern Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for hardcoded credentials
        run: |
          if grep -rn --include="*.ts" --include="*.tsx" -E "(password|secret|apikey)\s*=\s*[a-zA-Z0-9+/]{20,}" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . 2>/dev/null | \
            grep -v "placeholder\|example\|CHANGE_ME" | head -5; then
            echo "::warning::Potential hardcoded credentials detected."
          else
            echo "No hardcoded credential patterns detected."
          fi