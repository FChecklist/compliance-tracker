<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERIDIAN · DPDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#F5F6FA;--card:#FFFFFF;--line:#E3E5F0;--line2:#EEF0F6;
 --ink:#161A4A;--ink2:#4B4F7A;--ink3:#8A8DAE;
 --v:#3B3FB6;--vL:#ECEDFB;--g:#138A36;--gL:#E4F4E9;--r:#C8312A;--rL:#FBE8E6;--a:#C98204;--aL:#FDF1D6;--c:#0E7490;--cL:#DDF2F6;
 --s1:#3B3FB6;--s2:#0E7490;--s3:#C98204;--s4:#C8312A;--s5:#9D174D;--s6:#5B5FD8;--s7:#138A36;
 --r-lg:22px;--r-md:16px;--r-sm:11px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:var(--v)}
:focus-visible{outline:2px solid var(--v);outline-offset:2px;border-radius:6px}
h1,h2,h3,.who h1{font-family:Sora,system-ui,sans-serif;letter-spacing:-.02em}

/* ---------- top bar ---------- */
.top{position:relative;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
 border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .brand{font-family:Sora;font-weight:800;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-right:6px;letter-spacing:.02em}
.top .brand small{font-family:'Instrument Sans';font-weight:600;font-size:11px;color:var(--ink3);letter-spacing:0;margin-left:2px}
.bmark{width:22px;height:22px;border-radius:50%;border:2px solid var(--v);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--v);display:inline-block}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--line2);padding:3px;border-radius:12px;align-items:center}
.tabs button{padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,26,74,.08),0 0 0 1px var(--line)}
.tabs .lbl{font-size:10.5px;font-weight:600;color:var(--ink3);padding:0 6px 0 9px}
.demo{margin-left:auto;font-size:11px;color:var(--ink3)}
.pnav{position:sticky;top:0;z-index:25;background:rgba(245,246,250,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line2);padding:8px 20px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.pnav a{text-decoration:none;font-size:13px;font-weight:600;color:var(--ink2);padding:5px 13px;border-radius:20px}
.pnav a:hover{background:#fff;color:var(--v)}

/* ---------- page ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 56px}
.who{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.who h1{font-size:30px;margin:0;line-height:1.1;font-weight:700}
.who .role{font-size:14px;color:var(--ink2);margin-top:6px}
.who .me{background:#fff;border:1px solid var(--line);border-radius:40px;padding:8px 14px;font-size:12.5px;color:var(--ink2)}
.who .me b{color:var(--ink);font-weight:600}
.sec{margin-top:34px}
.sech{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sech h2{font-size:20px;margin:0;font-weight:700}
.sech span{font-size:13px;color:var(--ink3)}

/* ---------- the seal hero ---------- */
.hero{display:grid;grid-template-columns:236px 1fr;gap:18px;margin-bottom:6px}
.num.seal{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);display:grid;place-items:center;position:relative;padding:18px;min-height:236px}
.sealsvg{width:196px;height:196px;display:block}
.s-out{fill:none;stroke:var(--v);stroke-width:1.6}
.s-in{fill:none;stroke:var(--line);stroke-width:1}
.s-txt{font-family:Sora;font-size:8.6px;font-weight:700;letter-spacing:2.1px;fill:var(--v)}
.s-trk{fill:none;stroke:var(--vL);stroke-width:9}
.s-bar{fill:none;stroke:var(--g);stroke-width:9;stroke-linecap:round}
.first-paint .s-bar{animation:sealfill 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes sealfill{from{stroke-dasharray:0 400}}
.sealin{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.sealin b{font-family:Sora;font-size:28px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.03em}
.sealin span{font-size:12.5px;color:var(--ink3);margin-top:5px}
.herom{display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats .num{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;position:relative;min-height:86px}
.stats .num span{display:block;font-size:12.5px;color:var(--ink3)}
.stats .num b{display:block;font-family:Sora;font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.spark{position:absolute;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:3px;height:26px}
.spark i{display:block;width:6px;background:var(--v);border-radius:3px;opacity:.85}
.nums{display:contents}

/* ---------- do this now ---------- */
.now{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:0;flex:1}
.wrap>.now{margin-bottom:18px}
.now .ico{font-size:22px;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.now .tx{flex:1;min-width:220px}
.now .lb{font-size:12px;font-weight:600;color:#B9BCF0}
.now b{display:block;font-family:Sora;font-size:19px;font-weight:700;line-height:1.25;margin:3px 0 4px;letter-spacing:-.01em}
.now span{font-size:13.5px;color:#CFD1F3}
.now .go{background:#F2B53A;color:var(--ink);font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;flex:none}
.now .go:hover{background:#F6C45C}

/* ---------- parts track ---------- */
.track{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 10px 14px;margin:18px 0 14px;position:relative;overflow-x:auto}
.track::before{content:'';position:absolute;left:60px;right:60px;top:38px;height:2px;background:var(--line2)}
.tnode{flex:1;min-width:108px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;padding:0 4px;border-radius:12px}
.tnode:hover .tl{color:var(--v)}
.tring{width:46px;height:46px}
.t-trk{fill:#fff;stroke:var(--line2);stroke-width:3.4}
.t-bar{fill:none;stroke:var(--sc);stroke-width:3.4;stroke-linecap:round}
.t-n{font-family:Sora;font-size:11px;font-weight:800;fill:var(--ink)}
.full .t-n{fill:var(--g)}
.tl{font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;margin-top:7px;line-height:1.25}
.tc{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{font-style:normal;margin-left:6px;font-size:11px;background:var(--line2);color:var(--ink2);padding:1px 7px;border-radius:10px}
.chip.on i{background:rgba(255,255,255,.18);color:#fff}
.tools .sp{flex:1}
.btn{background:var(--v);color:#fff;font-size:13px;font-weight:600;padding:9px 15px;border-radius:var(--r-sm)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--g)}.btn.w{background:#fff;color:var(--ink);border:1px solid var(--line)}
.addbox{background:#fff;border:1px dashed var(--v);border-radius:var(--r-md);padding:12px;margin-bottom:10px;display:grid;grid-template-columns:2fr 1.2fr 1.4fr 170px 150px auto;gap:8px;align-items:center}
.addbox input,.addbox select,.frm input,.frm select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;width:100%}
.lawbar{background:#fff;border:1px solid var(--line2);border-radius:var(--r-md);padding:10px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:10px;line-height:2}

/* ---------- the sheet ---------- */
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto}
table{width:100%;border-collapse:collapse}
.big{min-width:1320px}
.big.lite{min-width:760px}.big.lite td:nth-child(8){min-width:330px}.big.lite td.dtc{max-width:180px}
thead th{background:#F8F9FC;color:var(--ink3);font-size:12px;font-weight:600;padding:12px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFBFE}
td.n{color:var(--ink3);font-family:Sora;font-size:12px;font-weight:600;text-align:center;width:44px}
td.what{font-weight:600;min-width:250px;color:var(--ink)}
td.c{text-align:center;font-family:Sora;font-weight:600}
td.ds{font-weight:600;min-width:118px;color:var(--ink)}
td.dtc{min-width:170px;max-width:240px}td.lawc{min-width:150px}
tr.gh td{background:color-mix(in srgb,var(--sc) 7%,#fff);color:var(--sc);font-family:Sora;font-weight:700;font-size:13.5px;padding:10px 14px;border-left:4px solid var(--sc)}
tr.gh td span{font-family:'Instrument Sans';font-weight:500;font-size:12px;color:var(--ink3);margin-left:10px}
tr.yes td{background:#F7FBF8}
tr.gap td.by{background:var(--aL)}
tr.na td{background:#F7F7FA!important;color:var(--ink3)}tr.na td.what{text-decoration:line-through}
tr.sel td{background:var(--vL)!important}
tr.click{cursor:pointer}

/* people */
.avw{display:inline-flex;align-items:center;gap:8px;max-width:100%;vertical-align:middle}
.avc{width:26px;height:26px;border-radius:50%;color:#fff;font-family:Sora;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.avc.s{width:20px;height:20px;font-size:9.5px}
.em{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px}

/* stamps and tags */
.pill{display:inline-block;padding:3px 11px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.y{color:var(--g);border:1.6px solid var(--g);background:#fff;transform:rotate(-3deg);letter-spacing:.03em}
.pill.n{background:var(--rL);color:var(--r)}
.pill.a{background:var(--aL);color:#8A5A00}.pill.c{background:var(--cL);color:var(--c)}
.pill.x{background:#EFEFF4;color:var(--ink3)}.pill.w{background:var(--cL);color:var(--c)}
.pill.v{background:var(--vL);color:var(--v)}
.due{white-space:nowrap;font-weight:600;font-family:Sora;font-size:12.5px}.due.late{color:var(--r)}.due.soon{color:var(--a)}.due.ok{color:var(--ink2)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:5px}
.tag.late{background:var(--rL);color:var(--r)}.tag.nob{background:var(--aL);color:#8A5A00}
.dt{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:7px;background:#F1F2F8;color:var(--ink2);margin:2px 4px 2px 0;white-space:nowrap}
.dt.sens{background:var(--rL);color:#9E2620;font-weight:600}
.lw{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;margin:2px 4px 2px 0;white-space:nowrap;cursor:help}
.lw-d{background:var(--vL);color:#2F339A}.lw-s{background:var(--gL);color:#0F6B2B}.lw-g{background:#F1F2F8;color:var(--ink3)}
.nowlaw{display:block;font-size:11px;font-weight:600;color:#0F6B2B;margin-top:3px}
.act{display:inline-block;margin:2px 0 2px 5px;background:var(--g);color:#fff;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;vertical-align:middle;cursor:pointer}
.act.up{background:var(--v)}.act.no{background:#EFEFF4;color:var(--ink2)}.act.nj{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.bigyes{background:var(--g);color:#fff;font-weight:700;font-size:13px;padding:9px 15px;border-radius:10px;margin:2px 6px 2px 0}
.bignj{background:#fff;color:var(--ink2);border:1px solid var(--line);font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:10px;margin:2px 6px 2px 0}
.ed{font-size:11.5px;color:var(--v);margin-left:6px;font-weight:600}
.inl{display:flex;gap:5px}
.inl input{flex:1;min-width:130px;padding:6px 9px;border:1px solid var(--a);border-radius:8px;font-size:12.5px;background:#fff}
.inl button{background:var(--a);color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px}
.mute{color:var(--ink3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin:10px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---------- first visit ---------- */
.wiz{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:18px;overflow:hidden;box-shadow:0 1px 0 var(--line2)}
.wizbar{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line2);background:#FAFBFD}
.wizbar div{padding:14px 18px;font-size:13px;font-weight:600;color:var(--ink3);display:flex;gap:10px;align-items:center}
.wizbar .c{width:26px;height:26px;border-radius:50%;background:var(--line2);color:var(--ink3);display:grid;place-items:center;font-family:Sora;font-weight:700;font-size:12px;flex:none}
.wizbar .on{color:var(--ink);background:#fff;box-shadow:inset 0 -2px 0 var(--v)}.wizbar .on .c{background:var(--v);color:#fff}
.wizbar .dn{color:var(--g)}.wizbar .dn .c{background:var(--g);color:#fff}
.wizbody{padding:28px}
.wizbody h2{font-size:24px;margin:0 0 6px;font-weight:700}
.wizbody .lead{font-size:15px;color:var(--ink2);margin:0 0 18px;max-width:72ch}
.opt{display:inline-block;background:var(--aL);color:#8A5A00;font-family:'Instrument Sans';font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;letter-spacing:0}
.prev{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 20px}
.prev>div{padding:12px 14px;border:1px solid var(--line2);border-left:4px solid var(--sc);border-radius:12px;font-size:13.5px;background:#fff}
.prev i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--sc);margin-right:8px}
.prev b{font-family:Sora}.prev .sm{margin-top:4px}
.arow{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line2)}
.arow b{display:block;font-size:14px}
.arow .ask{font-size:12.5px;color:var(--ink3);margin-top:3px}
.arow input,.arow textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;background:#fff}
.arow input:focus,.arow textarea:focus{border-color:var(--v);outline:0;box-shadow:0 0 0 3px var(--vL)}
.arow.got input,.arow.got textarea{border-color:var(--g);background:#F7FBF8}
.arow.isna input,.arow.isna textarea{opacity:.35;pointer-events:none}.arow.isna b{color:var(--ink3);text-decoration:line-through}
.pre{display:inline-block;background:var(--vL);color:var(--v);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:6px}
.nachk{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink2);margin-top:8px;cursor:pointer}
.bigbtn{background:var(--v);color:#fff;font-weight:700;font-size:15px;padding:13px 22px;border-radius:14px}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn.g{background:var(--g)}.bigbtn.w{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:660px}
.pick{border:1.5px solid var(--line);border-radius:18px;padding:22px;text-align:center;cursor:pointer;background:#fff;display:block}
.pick:hover{border-color:var(--v);box-shadow:0 0 0 4px var(--vL)}
.pick .pi{font-size:28px}
.pick b{display:block;font-family:Sora;font-size:16px;margin:8px 0 4px}
.pick span{font-size:13px;color:var(--ink2)}
.frm{display:grid;grid-template-columns:1.3fr 1fr;gap:6px;margin-bottom:6px}
.plist{max-height:190px;overflow:auto;margin-bottom:8px}
.pr{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.drop.ok{border-color:var(--g);background:var(--gL);color:var(--g);border-style:solid}
.okbanner{background:var(--gL);border:1px solid #BFE3CB;border-radius:var(--r-md);padding:13px 16px;margin-bottom:16px;font-size:13.5px}

/* ---------- email, report, history ---------- */
.mail{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);max-width:700px;overflow:hidden}
.mail .mh{background:#F8F9FC;padding:14px 18px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line2)}
.mail .mh b{display:block;color:var(--ink);font-family:Sora;font-size:15px;margin-top:4px}
.mail .mb{padding:14px 18px}
.mrow{border:1px solid var(--line2);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mrow b{font-size:13.5px}
.rgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.card .ch{padding:14px 18px;border-bottom:1px solid var(--line2);font-family:Sora;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .ch span{font-family:'Instrument Sans';font-weight:500;font-size:12.5px;color:var(--ink3)}
.card .cb{padding:14px 18px}
.card table thead th{background:#fff}
.pb{margin-bottom:14px}.pb:last-of-type{margin-bottom:4px}
.pbh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pbn{font-size:12.5px;color:var(--ink3);white-space:nowrap}.pbn .lt{color:var(--r);font-weight:600;margin-left:6px}
.pbar{height:10px;border-radius:6px;background:#EEF0F6;display:flex;overflow:hidden}
.pbar i{display:block;height:100%}.pbar .pd{background:var(--g)}.pbar .pl{background:var(--r)}.pbar .pp{background:#D9DCEC}
.wk{display:flex;align-items:flex-end;gap:12px;height:130px;padding-top:6px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.wk i{display:block;width:100%;max-width:34px;background:var(--v);border-radius:8px 8px 3px 3px}
.wk b{font-size:12px;font-family:Sora;margin-bottom:4px}
.wk span{font-size:11px;color:var(--ink3);margin-top:6px}
.hist{padding:8px 0}
.hist .h{display:flex;gap:14px;padding:10px 18px;position:relative}
.hist .h::before{content:'';position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--line2)}
