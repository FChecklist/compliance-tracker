# own "Compliance due 13 May 2027"; not separately owner-approved as a block.
# ---------------------------------------------------------------------------
key_dates:
  owner_approved: false
  source: WO-DPDP-013 v2 §2.2 and §1.3-A; dpdp-firm/index.html "Compliance due 13 May 2027"
