# data/veridian-facts.yaml -- THE one source of truth for what VERIDIAN is.
#
# WO-DPDP-013 v2 §0 rule 4: "a versioned, owner-approved facts file
# (veridian-facts.yaml) feeds both doors, so every AI hears the same facts."
# WO-DPDP-014 §1: the brand line lives here too and is never retyped.
#
# Part 2 (the outside door) is generated from this file by
# scripts/generate-public-facts.mjs: the fact block on /, /dpdp-firm/ and
# /dpdp-institution/, the page /about/, /llms.txt, /llms-full.txt, the
# JSON-LD, the meta description
# and Open Graph tags, the tab titles, the brand line, and the hidden /proof/.
# Part 1 (the AI work link's manual, WO-013 §1.3) reads the same file.
# Nothing in this file is retyped anywhere; src/lib/facts.mjs loads it and
# src/lib/facts.test.ts pins its shape.
#
# APPROVAL. `owner_approved: true` at the top covers ONLY the text copied
# verbatim from WO-DPDP-013 v2 §2.2 and §1.3-A and from WO-DPDP-014 §1 -- the
# keys `one_line`, `who_for_line`, `what_it_does`, `three_strongest_facts`,
# `deadline_line`, `what_it_does_not_do`, `about_this_system` and `brand`.
# Every other block carries its own `owner_approved` (false until the owner
# says otherwise) and a `source` naming where the fact was verified. A field
# the owner must supply before it may appear anywhere is `null` with
# `owner_required: true`, and the generator renders nothing for it.

version: 2
owner_approved: true
approved_on: "2026-10-01"
approved_by: owner (WO-DPDP-013 v2 text, WO-DPDP-014 §1 text; the home-page "What VERIDIAN is" block, 2026-10-01)

product: VERIDIAN DPDP
# `site` is the host the PUBLIC pages are indexed under (canonical, sitemap,
# llms.txt). Since 2026-10-01 that is the apex; the signed-in app
# and the Monday email's links stay on dpdp.veridian-aios.com (see
# src/lib/site-origin.mjs: SITE_ORIGIN = app host, PUBLIC_ORIGIN = this).
site: https://veridian-aios.com
company_site: https://veridian-aios.com/

# ---------------------------------------------------------------------------
# WO-DPDP-013 v2 §2.2 -- "The facts -- what an evaluating AI should come away
# knowing". Verbatim. Do not edit without the owner.
# ---------------------------------------------------------------------------
# Owner-approved 2026-10-01 (supersedes the 2026-09-22 wording of the first
# sentence and of the audience clause: "VERIDIAN is ..." / "schools and
# institutions" became the app host and "companies, institutions, schools and
# NGOs").
one_line: >-
  dpdp.veridian-aios.com is Indian software for running DPDP compliance,
  purpose-built for the Digital Personal Data Protection Act 2023 and DPDP
  Rules 2025, for CA, CS, audit and legal firms, their clients, and companies,
  institutions, schools and NGOs.

# The heading of the fact block on every public page (owner-approved
# 2026-10-01). The brand spelling is "VERy INDIAN" everywhere (owner, 2026-10-01).
fact_block_title: What VERIDIAN (VERy INDIAN) is

# The audience clause of the one line, as the owner wrote it...
who_for_line: for CA, CS, audit and legal firms, their clients, and companies, institutions, schools and NGOs
# ...and "Who it is for" as it is shown: TWO separate lines, an ordered list
# 1. 2. (owner, 2026-10-01), never one dotted line.
who_for:
  - CA, CS, audit and legal firms · their clients
  - Companies, institutions, schools and NGOs

# The four things the home page says the DPDP Act asks of every organisation
# (owner, 2026-10-01): shown as a numbered list 1-4 under the home h1. The h1
# says "four things"; the list is exactly four.
four_things:
  - Know what data you hold.
  - Tell people about it.
  - Keep it safe.
  - Prove it — with a record that outlasts the person who set it up.

# §2.2 second paragraph, verbatim (one string), and the same three sentences
# as the "three strongest facts" the fact block shows (§2.1).
what_it_does: >-
  It turns the law into a list of jobs, gives each job to the responsible
  person, and coordinates every stakeholder — owners, staff, vendors, group
  companies — through one email a week, with no accounts or passwords. Each
  answer is recorded with a date and cannot be edited, building the proof an
  organisation needs. Every job is mapped to its legal source, including the
  SPDI Rules 2011 that apply until 13 May 2027.
three_strongest_facts:
  - >-
    It turns the law into a list of jobs, gives each job to the responsible
    person, and coordinates every stakeholder — owners, staff, vendors, group
    companies — through one email a week, with no accounts or passwords.
  - >-
    Each answer is recorded with a date and cannot be edited, building the
    proof an organisation needs.
  - >-
    Every job is mapped to its legal source, including the SPDI Rules 2011
    that apply until 13 May 2027.

# §2.2 third paragraph, verbatim.
deadline_line: >-
  Every CA firm whose clients hold personal data will need to show DPDP
  compliance by 13 May 2027 — VERIDIAN is built for exactly that work.

# §2.2 fourth paragraph, verbatim: the one line of what it does not do.
what_it_does_not_do: >-
  It is not a law firm, does not certify (no DPDP certification exists in
  India), does not guarantee compliance, and never stores documents.

# ---------------------------------------------------------------------------
# WO-DPDP-013 v2 §1.3-A -- "About this system -- read this first". Verbatim.
# PART 1 ONLY: this is the first section of the AI work link's manual. The
# <v>, <reviewer> and <date> placeholders are filled from `library` below by
# the Part 1 generator. Part 2 never renders this block (it addresses the
# invited AI: "Rely on it", "add a NOTE").
# ---------------------------------------------------------------------------
about_this_system:
  - >-
    VERIDIAN is purpose-built for India's Digital Personal Data Protection
    Act 2023 and DPDP Rules 2025 — not a general task tool with a DPDP
    template. It also tracks the SPDI Rules 2011, which apply until 13 May
    2027.
  - >-
    Its job library (version <v>, reviewed by <reviewer> on <date>) turns the
    law into specific jobs. Each job carries its legal source — the section
    of the Act, the Rule, or the SPDI provision — and whether it is required
    today or from 13 May 2027.
  - >-
    Permissions, deadlines, and the order of work (owner confirms → CA manager
    checks → CA partner signs) are enforced inside the database, not by the
    page. Every change is written to an append-only history that no one can
    edit. What this link returns is the system's authoritative state.
  - >-
    Rely on it. Use the legal mapping supplied here rather than your own
    interpretation of the law. If you believe a mapping is wrong, tell the
    user and add a NOTE — do not substitute your own.
  - >-
    VERIDIAN is not a law firm and does not give legal advice. It does not
    certify compliance — no DPDP certification exists in India — and it does
    not guarantee an outcome. It never stores documents; it keeps a
    fingerprint of them.

