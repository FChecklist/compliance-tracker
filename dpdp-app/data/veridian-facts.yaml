pages:
  owner_approved: false
  "/":
    name: DPDP Compliance Management Software for India
    description: DPDP compliance management software for India. It turns the DPDP Act 2023 and DPDP Rules 2025 into jobs with owners, for CA firms, their clients, companies, schools and NGOs.
    summary: "the home page: choose CA, CS, legal or audit firm doing it for clients, or company, institution, school or NGO doing it for itself"
    audience: CA, CS, audit and legal firms, their clients, and companies, institutions, schools and NGOs
  "/dpdp-firm/":
    name: DPDP Act Compliance for CA, CS, Audit and Legal Firms
    description: DPDP Act compliance for CA, CS, audit and legal firms working for their clients. Jobs mapped to the law and a dated record nobody can edit. Compliance due 13 May 2027.
    summary: "for a CA, CS, audit or legal firm doing DPDP compliance for its clients"
    audience: CA, CS, audit and legal firms doing DPDP compliance for their clients
  "/dpdp-institution/":
    name: DPDP Act Compliance for Companies, Institutions, Schools and NGOs
    description: DPDP Act compliance for companies, institutions, schools and NGOs doing it for themselves. Jobs mapped to the law and a dated record nobody can edit. Compliance due 13 May 2027.
    summary: "for a company, institution, school or NGO doing DPDP compliance for itself"
    audience: Companies, institutions, schools and NGOs handling personal data
  "/about/":
    name: About VERIDIAN
    description: About VERIDIAN, DPDP compliance software for India. The SPDI Rules 2011 apply until 13 May 2027; compliance with the DPDP Act 2023 and DPDP Rules 2025 is due from 13 May 2027.
    summary: "what VERIDIAN is, who it is for, what it does and does not do, key dates, where the data is, the company"
    audience: CA, CS, audit and legal firms, their clients, and companies, institutions, schools and NGOs
  "/partner/":
    name: Become a Sales Partner
    description: Become a VERIDIAN Sales Partner. Get a personal link, share it with firms and organisations, and earn a commission when an organisation you referred pays.
    summary: "who can be a Sales Partner, how to get a personal link, what is earned when a referred organisation pays, and how payment is made"
    audience: People who introduce VERIDIAN to CA, CS, audit and legal firms, companies, institutions, schools and NGOs
  "/proof/":
    name: Proof
    summary: "evidence from real use: real-tenant aggregates, consented case studies, the library reviewer"
    audience: CA, CS, audit and legal firms, their clients, and companies, institutions, schools and NGOs
# ---------------------------------------------------------------------------
# /partner/ (owner, 2026-10-01): the public page for the in-app Refer & Earn.
# Every rule on it is a rule that already exists in code; nothing is invented:
#   * who gets a link and where the Share button is: drizzle/0655 (dpdp__share_role
#     returns a role for EVERY member), src/components/ShareVeridian.tsx;
#   * 20% on a yearly payment, on every renewal, with no time limit; 5% on the
#     first confirmed monthly payment only: drizzle/0655 dpdp_record_confirmed_payment
#     (v_rate := 0.20 / 0.05) -- src/lib/facts.test.ts compares the percentages
#     written below with that SQL, so the page cannot drift from the database;
#   * a payment counts only once the company confirms it by hand:
#     dpdp_record_confirmed_payment / dpdp_owner_approve_payment (drizzle/0658);
#   * your own organisation never counts: self_referral is blocked (drizzle/0655);
#   * payout is by hand, outside the system (UPI or bank): drizzle/0655 header,
#     dpdp_admin_pending_payouts / dpdp_mark_commission_paid.
# NOT stated, because no code or owner text defines it: a payout date or minimum,
# tax and TDS treatment of the commission, a partner agreement. The page says so
# in plain words and sends the reader to the one published address.
# `owner_approved` stays false: the owner has approved the programme's rules in
# chat (see the migration header), not this page's wording.
# ---------------------------------------------------------------------------
sales_partner:
  owner_approved: false
  source: drizzle/0655_dpdp_wo016_refer_and_earn.sql, drizzle/0658_dpdp_payment_confirmation_flow.sql, src/components/ShareVeridian.tsx, src/components/BillingPanel.tsx
  nav_label: Sales Partner
  button: Become a Sales Partner
  lead: Tell CA, CS, audit and legal firms, companies, institutions, schools and NGOs about VERIDIAN. When an organisation you referred pays, you earn a commission.
  sign_in_note: You sign in with your email. We send you a link. There is no password.
  sections:
    - h2: Who can be a Sales Partner
      paragraphs:
        - Anyone with a VERIDIAN account. Every person who belongs to an organisation in VERIDIAN has a personal link to share.
        - You do not have an organisation yet? Sign in with your email and open your own. It is free to start.
    - h2: How you get your personal link
      steps:
        - Sign in at /app/ with your email.
        - Open the page of your organisation.
        - Press Share, in the bar at the very top of the page.
        - Copy your link, or send it by WhatsApp or email.
      bullets:
        - The link opens our public website. It holds your personal code and nothing else.
        - Your code stays the same every time.
    - h2: What happens when someone you referred pays
      steps:
        - A person opens an organisation in VERIDIAN with your code. We note that you referred them.
        - The organisation pays us.
        - We see the money and confirm the payment by hand. Until then, no commission is created.
        - Your commission is created and shows as pending.
      bullets:
        - "You earn 20% of each yearly payment, including every yearly renewal, for as long as that client stays."
        - Your own organisation never counts. If you sign up through your own link, you earn nothing.
    - h2: How you are paid
      paragraphs:
        - We pay by hand, by UPI or bank transfer. Payment is not automatic, and this page does not fix a payout date.
        - Each commission is marked pending. We mark it paid after we send the money.
        - After your first referral you can see what you have earned, and what is still pending, in the Share box in the app.
    - h2: Please note
      paragraphs:
        - We cannot promise that you will earn anything. What you earn depends on whom you refer and whether they pay.
        - This page does not cover tax on a commission. For a question about a payout or about tax, write to us with the subject "Partner".

