# ---------------------------------------------------------------------------
# Per-page names and audiences (WO-014 §4 tab titles; WO-013 §2.1 JSON-LD
# SoftwareApplication.audience). The edition audiences are the ones the
# landings already carried. Not owner-approved as wording.
# ---------------------------------------------------------------------------
#
# SEO (2026-10-01): `name` is the tab title after "VERIDIAN · VERy INDIAN — ",
# and the optional `description` is the page's meta description / og:description
# / twitter:description (60-200 characters; the one line above is used when a
# page has none). Both are written to match what people search for -- "DPDP
# compliance management software India", "DPDP Act compliance for CA firms",
# "DPDP compliance for schools", "13 May 2027" -- using only facts already
