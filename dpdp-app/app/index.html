<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The signed-in one-page app, served at /app/ (WO-DPDP-011 §2.1). It is
      PRIVATE (WO-DPDP-012 §2): never indexed, never crawled, and its URL
      never leaks as a referrer -- public/_headers sends the same X-Robots-Tag
      and Referrer-Policy over HTTP for /app/*, and public/robots.txt
      disallows the prefix for every bot. No third-party <link>/<script> of
      any kind belongs on this page: it holds a session token.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>VERIDIAN DPDP</title>
    <link rel="preload" href="/fonts/sora-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
