# Cloudflare Pages configuration for the static DPDP site (WO-DPDP-011 Step 7).
# The site is static files plus two small Pages Functions in functions/:
#   functions/ai/*           the AI work link proxy (WO-DPDP-012 section 7): no bindings, no secrets
#   functions/api/telemetry  first-party monitoring (2026-10-02): the D1 binding below and the
#                            Pages secret REPORT_KEY (set with `wrangler pages secret put`, never here)
#   functions/api/visit      first-party visit-journey beacon relay (2026-10-06) to the dpdp-track Edge Function;
#                            optional Pages secret VISIT_PROXY_KEY (never here)
# `wrangler pages deploy dist` (the deploy workflow) reads this file from dpdp-app/ and picks up
# functions/ next to it. The only build-time inputs are the PUBLIC Supabase URL and anon key (set as
# Pages environment variables or GitHub repository variables, never here).
name = "veridian-dpdp-app"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Free D1 database for first-party monitoring (page views, speed, errors). Created 2026-10-02 with
# `wrangler d1 create dpdp-telemetry`; the tables are in data/telemetry.sql. The id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "dpdp-telemetry"
database_id = "55c55442-0977-4165-83da-956ecafe2ce4"

# Visitor analytics (NOT active): the relay at functions/api/_visit.ts also copies each visit beacon into the ONE central visitor database. Create it first
# (wrangler d1 create site-analytics), put its real id below and remove the leading '#'. A made-up id would break the deploy, so it stays a comment until the owner has the id.
# The Pages secret ANALYTICS_KEY (same value as on the other sites) is needed too. Without the binding the relay behaves exactly as before.
# [[d1_databases]]
# binding = "ANALYTICS"
# database_name = "site-analytics"
# database_id = "<real id from wrangler d1 create>"
